<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostrador vivo · Bússola DTS 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@500;600;700&display=swap">
<!-- =====================================================================
     MOSTRADOR VIVO · o painel de resultados para projetar no encontro
     Lê a mesma planilha da bússola (Apps Script) e se atualiza sozinho.
     Abra este arquivo no computador do projetor, digite a senha do painel
     (o TOKEN do Codigo.gs) e deixe na tela. Não envie este arquivo aos diretores.
     ===================================================================== -->
<script id="mostrador-config">
  window.MOSTRADOR_CONFIG = {
    sheetsEndpoint: 'https://script.google.com/macros/s/AKfycbxEJxSQi9gT5BWQWhPkEl3NQW_EIAg0W65EDpOe59HN6wjx4Zvxf2fsPJIX7Z7j_WW4VA/exec',   // o mesmo link /exec da bússola
    painelToken: '',      // deixe vazio: a senha é digitada na tela e fica só neste computador
    intervaloSeg: 8,      // de quantos em quantos segundos ler a planilha
    rotacaoSeg: 25        // tempo de cada página na rotação automática
  };
</script>
<style>
/* ---------- tokens: claro (padrão A&M) e escuro neutro ---------- */
:root{
  --navy:#002B49; --orange:#F78C16; --peach:#FCD1A2; --pos:#9ACC3C; --att:#F9C20A; --neg:#CF3D3D;
  --bg:#F5F7F8; --surface:#FFFFFF; --ink:#002B49; --ink2:#33556D; --ink3:#5F7688; --line:#D7DDE2; --soft:#EBEEF1;
  --d1:#002B49; --d2:#5E8AB4; --d3:#99AAB6; --badge:#002B49; --badge-fg:#FFFFFF; --g-ink:#4F7A17; --r-ink:#B42E2E;
  --serif:'Zilla Slab',Georgia,serif; --sans:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Courier Prime',ui-monospace,Menlo,monospace; --ease:cubic-bezier(.2,.8,.2,1);
  --gap:.9rem; --px:2rem; --py:1.15rem; --r:10px;
}
:root[data-tema="escuro"]{
  --bg:#111316; --surface:#191C20; --ink:#F2F4F6; --ink2:#C2C9D0; --ink3:#8C96A0; --line:#2B3036; --soft:#24282D;
  --d1:#F2F4F6; --d2:#7EA1C3; --d3:#5C6772; --badge:#F2F4F6; --badge-fg:#111316; --g-ink:#A9D45A; --r-ink:#F08A8A;
}
/* ---------- escala por viewport (zoom 100%): largura e altura ---------- */
html{font-size:15px}
@media (min-width:1440px){html{font-size:15.5px}}
@media (min-width:1600px){html{font-size:16px}}
@media (min-width:1800px) and (min-height:900px){html{font-size:17px}}
@media (min-width:2200px) and (min-height:1100px){html{font-size:19px}}
@media (max-width:1366px){html{font-size:14.5px}}
@media (max-width:1280px){html{font-size:14px}}
@media (max-height:820px){html{font-size:14.5px}:root{--gap:.75rem;--py:.95rem}}
@media (max-height:720px){html{font-size:13.5px}:root{--gap:.65rem;--py:.8rem;--px:1.6rem}}
@media (max-height:640px){html{font-size:12.5px}:root{--gap:.55rem;--py:.65rem;--px:1.4rem}}
@media (max-width:1100px){:root{--px:1.3rem}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.ui{position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:1760px;overflow-y:auto;display:grid;grid-template-rows:auto auto minmax(min-content,1fr) auto auto;gap:var(--gap);padding:var(--py) var(--px)}

/* cabeçalho */
.hd{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
.brand h1{display:flex;align-items:center;gap:.7rem;font-family:var(--serif);font-weight:700;font-size:1.5rem;line-height:1;color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:.4rem;font:600 .68rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:.32rem .7rem;background:var(--surface)}
.live i{width:.5rem;height:.5rem;border-radius:50%;background:var(--orange);animation:pulse 1.6s infinite}
.live.off i{background:var(--d3);animation:none}
.live.demo i{background:var(--d2);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(247,140,22,.55)}70%{box-shadow:0 0 0 .45rem rgba(247,140,22,0)}100%{box-shadow:0 0 0 0 rgba(247,140,22,0)}}
.hdr{display:flex;align-items:center;gap:1.6rem}
.count{display:flex;gap:1.4rem;align-items:baseline}
.ct{display:flex;align-items:baseline;gap:.45rem}
.ct b{font-family:var(--serif);font-weight:700;font-size:1.85rem;line-height:1;color:var(--ink)}
.ct>span{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.ct.hi b{box-shadow:inset 0 -.18em 0 rgba(247,140,22,.55)}
.acts{display:flex;gap:.5rem}
.acts button,.ctl button,.plx button[data-c="copia-plano"]{display:inline-flex;align-items:center;gap:.45rem;height:2.15rem;padding:0 .85rem;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;color:var(--ink);white-space:nowrap;transition:border-color .2s,background .2s}
.acts button:hover,.ctl button:hover,.plx button:hover{border-color:var(--ink2)}
.acts button svg,.ctl button svg{width:1rem;height:1rem}
.acts button.zera:hover{border-color:var(--neg);color:var(--r-ink)}
.acts button[disabled]{opacity:.5;pointer-events:none}

/* manchete */
.headline{border-left:3px solid var(--orange);padding:.1rem 0 .1rem 1rem}
.headline h2{font-family:var(--serif);font-weight:700;font-size:1.85rem;line-height:1.1;color:var(--ink)}
.headline p{font-size:.95rem;line-height:1.45;color:var(--ink2);margin-top:.3rem;max-width:72rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.headline p b{color:var(--ink)}

/* as 4 frentes */
.qs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--gap)}
.qc{display:grid;grid-template-columns:1.9rem minmax(0,1fr);gap:0 .85rem;align-content:start;padding:1rem 1.2rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qc .nb{grid-row:1/6;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--badge-fg);background:var(--badge)}
.qc .qq{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.qc .qq h3{font-size:1.05rem;font-weight:600;line-height:1.3;color:var(--ink)}
.qc .qq span{flex:none;font-size:.74rem;color:var(--ink3)}
.qc .ans{font-family:var(--serif);font-weight:700;font-size:1.45rem;line-height:1.15;color:var(--ink);margin-top:.3rem}
.qc .fact{font-size:.9rem;line-height:1.45;color:var(--ink2);margin-top:.35rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qc .fact b{color:var(--ink)}
.qc .viz{margin-top:.7rem}
.qc .wait{font-size:.92rem;font-style:italic;color:var(--ink3);margin-top:.5rem}

.stk{display:flex;height:.85rem;border-radius:4px;overflow:hidden;background:var(--soft)}
.stk i{display:block;height:100%;transition:flex-grow 1.1s var(--ease)}
.stk-l{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:.35rem;font-size:.74rem;color:var(--ink3)}
.stk-l span:nth-child(2){text-align:center;color:var(--ink);font-weight:600}.stk-l span:last-child{text-align:right}
.bars{display:flex;flex-direction:column;gap:.35rem}
.bar{display:grid;grid-template-columns:var(--lw,12.5rem) minmax(0,1fr) 3rem;align-items:center;gap:.75rem;font-size:.84rem}
.bar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bar.top>span:first-child{color:var(--ink);font-weight:600}
.bar .v{font-family:var(--serif);font-weight:700;color:var(--ink);text-align:right}
.tr{position:relative;height:.5rem;border-radius:99px;background:var(--soft)}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--d2);width:var(--to);animation:grow 1.1s var(--ease)}
.tr i.hi{background:var(--d1)}
.tr em{position:absolute;top:-.3rem;bottom:-.3rem;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--orange);left:var(--p)}
@keyframes grow{from{width:var(--from)}}
.dots{display:flex;gap:1.2rem;flex-wrap:wrap}
.dots div{display:flex;flex-direction:column;align-items:center;gap:.3rem;font-size:.72rem;color:var(--ink3)}
.dots i{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--serif);font-style:normal;color:#002B49}
.dots i.neg{color:#fff}

/* faixa do plano */
.plen{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.2rem;padding:.8rem 1.2rem;border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:var(--r);background:var(--surface)}
.plen .k{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.plen .pt{font-size:.92rem;color:var(--ink2)}.plen .pt b{color:var(--ink);font-family:var(--serif)}
.plen .abre{height:2.35rem;padding:0 1.2rem;border-radius:6px;background:var(--badge);color:var(--badge-fg);font-weight:700;font-size:.9rem;white-space:nowrap}
.plen .abre:hover{opacity:.88}

/* rodapé */
.ft{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.ft .st{font-size:.76rem;color:var(--ink3)}
.ctl{display:flex;gap:.45rem;flex-wrap:wrap}
.ctl button{height:1.95rem;font-size:.78rem;color:var(--ink2)}

/* avisos e portão */
.toast{position:absolute;left:50%;bottom:3.4rem;transform:translate(-50%,.5rem);opacity:0;pointer-events:none;z-index:7;padding:.5rem 1rem;border-radius:99px;background:#002B49;color:#fff;font-size:.88rem;transition:all .5s var(--ease);white-space:nowrap;box-shadow:0 .4rem 1.2rem rgba(0,43,73,.18)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--peach)}
.banner{position:absolute;left:50%;bottom:3.2rem;transform:translateX(-50%);z-index:9;padding:.45rem 1rem;border-radius:6px;background:#FCEBEB;border:1px solid var(--neg);font-size:.8rem;color:#7A1F1F;display:none}
.banner.on{display:block}
.gate{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(0,43,73,.28);backdrop-filter:blur(3px)}
.gate.off{display:none}
.gcard{width:min(30rem,92%);padding:1.4rem 1.5rem;border-radius:var(--r);background:#fff;color:#002B49;border:1px solid #D7DDE2;box-shadow:0 1rem 2.5rem rgba(0,43,73,.2)}
.gcard .k{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#33556D}
.gcard h2{font-family:var(--serif);font-size:1.45rem;color:#002B49;margin:.3rem 0 .35rem;line-height:1.1}
.gcard p{font-size:.9rem;line-height:1.45;color:#33556D}
.gcard input{width:100%;margin-top:.8rem;font:inherit;font-size:.95rem;padding:.6rem .8rem;border-radius:6px;border:1px solid #99AAB6;background:#fff;color:#002B49}
.gcard .row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.gcard .row button{height:2.4rem;padding:0 1.1rem;border-radius:6px;border:1px solid #002B49;color:#002B49;font-weight:700;font-size:.88rem}
.gcard .row .go{background:#002B49;color:#fff}
.gcard .msg{min-height:1.3em;margin-top:.6rem;font-size:.82rem;color:#B42E2E}

/* ---------- plano de ação do time (tela cheia, 4 abas) ---------- */
.plano{position:absolute;inset:0;z-index:8;display:none;background:var(--bg)}
.plano.on{display:block}
.pl{position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:1760px;display:flex;flex-direction:column;gap:var(--gap);padding:var(--py) var(--px)}
.plh{display:flex;justify-content:space-between;gap:1.2rem;align-items:flex-start}
.plh h2{font-family:var(--serif);font-weight:700;font-size:1.65rem;color:var(--ink);line-height:1.1}
.plh p{font-size:.92rem;color:var(--ink2);margin-top:.25rem}
.plx{display:flex;gap:.5rem;align-items:center}
.plh .x{width:2.15rem;height:2.15rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;line-height:1}
.pl .sw-tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line)}
.pl .sw-tabs button{display:flex;align-items:center;gap:.5rem;padding:.6rem .95rem;font-size:.95rem;font-weight:600;color:var(--ink3);border-bottom:3px solid transparent;margin-bottom:-1px}
.pl .sw-tabs button span{display:grid;place-items:center;width:1.45rem;height:1.45rem;border-radius:50%;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--ink2)}
.pl .sw-tabs button:hover{color:var(--ink)}
.pl .sw-tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
.pl .sw-tabs button.on span{background:var(--badge);color:var(--badge-fg)}
.plb{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--gap)}
.pl .sw-n{flex:none;display:inline-grid;place-items:center;width:1.45rem;height:1.45rem;border-radius:50%;font-size:.74rem;font-weight:700;background:var(--badge);color:var(--badge-fg)}
.pl .sw-vz{font-size:.86rem;color:var(--ink3);font-style:italic}

/* 1 · somos assim */

/* 2 · ganhos e perdas */

/* 3 · SWOT */
.pl .sw-swot{flex:1;min-height:0;display:grid;grid-template-columns:1.6rem 1fr 1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);gap:.55rem var(--gap)}
.pl .sw-ax{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.pl .sw-ax.c1{grid-area:1/2}.pl .sw-ax.c2{grid-area:1/3}
.pl .sw-ax.r1,.pl .sw-ax.r2{writing-mode:vertical-rl;transform:rotate(180deg)}
.pl .sw-ax.r1{grid-area:2/1}.pl .sw-ax.r2{grid-area:3/1}
.pl .sw-qd{min-height:0;overflow:auto;padding:.9rem 1.15rem;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);background:var(--surface)}
.pl .sw-qd.s{grid-area:2/2;--c:var(--pos)}.pl .sw-qd.w{grid-area:2/3;--c:var(--neg)}.pl .sw-qd.o{grid-area:3/2;--c:var(--d2)}.pl .sw-qd.t{grid-area:3/3;--c:var(--att)}
.pl .sw-qd header{display:flex;align-items:center;gap:.75rem;margin-bottom:.65rem}
.pl .sw-L{font:700 1.9rem/1 var(--serif);color:var(--c)}
.pl .sw-qd h4{font-size:1.02rem;font-weight:700;color:var(--ink)}
.pl .sw-qd small{display:block;font-size:.76rem;color:var(--ink3)}
.pl .sw-qd ul{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.pl .sw-qd li{display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem;line-height:1.45;color:var(--ink)}
.pl .sw-qd li .sw-n{margin-top:.05rem}
.pl .sw-leg{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;font-size:.78rem;color:var(--ink3)}
.pl .sw-leg .sep{display:inline-block;width:.9rem}

/* 4 · possíveis ações */


/* tamanho de leitura da agenda: cresce com a tela, para quem está sentado longe do projetor */
.plano{--fs:clamp(1rem,calc(1.55vh + .42vw),1.15rem)}
/* 1 · somos assim: diagnóstico, sem ação */
.pl .sw-somos{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--gap)}
.pl .sw-somos article{display:flex;gap:.9rem;padding:.95rem 1.2rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.pl .sw-somos .sw-n{width:1.9rem;height:1.9rem;font-size:.9rem}
.pl .sw-q{font-size:calc(var(--fs)*.88);font-weight:600;line-height:1.25;color:var(--ink3)}
.pl .sw-somos b{display:block;font-family:var(--serif);font-size:calc(var(--fs)*1.45);line-height:1.15;color:var(--ink);margin:.2rem 0 .4rem}
.pl .sw-tag{display:inline-block;margin-bottom:.45rem;padding:.18rem .65rem;border-radius:99px;font-size:calc(var(--fs)*.72);font-weight:700;border:1px solid var(--line);color:var(--ink2);background:var(--soft)}
.pl .sw-tag.dif{border-color:var(--orange);background:rgba(247,140,22,.12);color:var(--ink)}
.pl .sw-som{font-size:calc(var(--fs)*1.1);line-height:1.38;color:var(--ink)}
.pl .sw-facts{list-style:none;margin-top:.55rem;display:flex;flex-direction:column;gap:.3rem}
.pl .sw-facts li{position:relative;padding-left:1rem;font-size:calc(var(--fs)*.94);line-height:1.35;color:var(--ink2)}
.pl .sw-facts li::before{content:"";position:absolute;left:0;top:.55em;width:.42rem;height:.42rem;border-radius:50%;background:var(--ink)}

/* 2 · ganhos e perdas: ocupa a tela toda */
.pl .sw-gp{flex:1;min-height:0;display:grid;grid-template-rows:auto repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.pl .sw-gh,.pl .sw-gr{display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:1.6rem;padding:.7rem 1.4rem}
.pl .sw-gh{align-items:center;background:var(--soft);font-size:calc(var(--fs)*.78);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.pl .sw-gh .g{color:var(--g-ink)}.pl .sw-gh .p{color:var(--r-ink)}
.pl .sw-gr{align-items:center;overflow:hidden}
.pl .sw-gr+.sw-gr{border-top:1px solid var(--line)}
.pl .sw-gr>div{display:flex;gap:.8rem;align-items:flex-start}
.pl .sw-gr .sw-n{width:1.9rem;height:1.9rem;font-size:.9rem}
.pl .sw-gr em{display:block;font-style:normal;font-size:calc(var(--fs)*.78);color:var(--ink3);line-height:1.25}
.pl .sw-gr b{display:block;font-family:var(--serif);font-size:calc(var(--fs)*1.12);line-height:1.2;color:var(--ink);margin-top:.15rem}
.pl .sw-gr p{font-size:var(--fs);line-height:1.38;color:var(--ink);padding-left:1rem}
.pl .sw-gr p.g{border-left:5px solid var(--pos)}.pl .sw-gr p.p{border-left:5px solid var(--neg)}

/* 3 · SWOT */
.pl .sw-qd li{font-size:calc(var(--fs)*.84);line-height:1.35}.pl .sw-qd h4{font-size:calc(var(--fs)*1.05)}.pl .sw-qd ul{gap:.4rem}.pl .sw-qd{padding:.7rem 1rem}.pl .sw-qd header{margin-bottom:.4rem}

/* 4 · possíveis ações: colunas na altura toda */
.plb>.plg{flex:1;min-height:0}
.plg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);align-items:stretch}
.plg section{display:flex;flex-direction:column;gap:.55rem;padding:.85rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:0;overflow:auto}
.plg .fh{display:flex;gap:.7rem;align-items:flex-start}
.plg .nb{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--badge-fg);background:var(--badge)}
.plg .fq{display:block;font-size:calc(var(--fs)*.74);font-weight:600;line-height:1.25;color:var(--ink3)}
.plg .fh b{display:block;font-family:var(--serif);font-size:calc(var(--fs)*1.02);line-height:1.2;color:var(--ink);margin-top:.15rem}
.plg .dec{font-size:calc(var(--fs)*.8);line-height:1.35;color:var(--ink);padding:.5rem .7rem;border-radius:6px;background:var(--bg);border-left:4px solid var(--d1)}
.plg .dec i{display:block;font-style:normal;font-size:calc(var(--fs)*.68);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.2rem;color:var(--ink2)}
.acs{display:flex;flex-direction:column;gap:.4rem;flex:1}
.acao{flex:1;display:flex;align-items:center;text-align:left;font-size:calc(var(--fs)*.82);line-height:1.34;padding:.5rem .7rem .5rem 2.9rem;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);position:relative;transition:border-color .2s,background .2s}
.acao:hover{border-color:var(--ink3)}
.acao::before{content:"";position:absolute;left:.8rem;top:50%;margin-top:-.55rem;width:1.1rem;height:1.1rem;border-radius:3px;border:2px solid var(--ink2);background:var(--surface)}
.acao.ok{border-color:var(--pos);background:rgba(154,204,60,.14)}.acao.ok::before{background:var(--pos);border-color:var(--pos)}
.acao.nao{opacity:.5;text-decoration:line-through}.acao.nao::before{border-color:var(--neg);background:rgba(207,61,61,.35)}
.nova{font:inherit;font-size:calc(var(--fs)*.78);padding:.5rem .7rem;border-radius:7px;border:1px dashed var(--line);background:transparent;color:var(--ink)}
.nova::placeholder{color:var(--ink3)}
.nova:focus{outline:none;border-color:var(--ink2);border-style:solid}
.plf{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.plf .id{display:flex;flex-wrap:wrap;gap:.35rem 1.1rem;align-items:baseline;font-size:calc(var(--fs)*.88);color:var(--ink2)}
.plf .id b{font-size:calc(var(--fs)*.72);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.plf .id span{font-style:italic}
.plf .id .vz{color:var(--ink3)}

/* ---------- quebras por largura ---------- */
@media (max-height:720px){.pl .sw-qd{padding:.75rem 1rem}.pl .sw-qd header{margin-bottom:.45rem}.pl .sw-L{font-size:1.6rem}.pl .sw-somos article{padding:.7rem 1rem}.pl .sw-facts li:nth-child(n+3){display:none}}
@media (max-width:1100px){.plg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1280px){.bar{grid-template-columns:var(--lw,10rem) minmax(0,1fr) 2.6rem}}
@media (max-width:960px){
  body{overflow:auto}.stage{height:auto;min-height:100vh}.ui{position:relative;overflow:visible;grid-template-rows:none}
  .qs{grid-template-columns:1fr;grid-template-rows:none}.plen{grid-template-columns:1fr}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  g.innerHTML = `<div class="gcard"><div class="k">Mostrador vivo · conexão</div><h2>Ligar o mostrador à planilha</h2><p>Digite a senha do painel (o TOKEN do Codigo.gs). Ela fica guardada só neste computador. Para ensaiar sem dados, veja a simulação.</p><input id="gsenha" type="password" autocomplete="off" placeholder="Senha do painel"><div class="msg">${esc(msg || '')}</div><div class="row"><button data-g="demo">Ver simulação</button><button class="go" data-g="ok">Conectar</button></div></div>`;
  setTimeout(() => { const i = $('#gsenha'); if (i) i.focus(); }, 50);
}
function conectar() { const v = ($('#gsenha') || {}).value; if (!v) return; try { localStorage.setItem('mostrador-senha', v.trim()); } catch (e) { } fonte = 'planilha'; ultimaOk = 0; $('#gate').classList.add('off'); ciclo(); }

/* ---------------- simulação para ensaio (dados fictícios) ---------------- */
const Demo = (() => {
  let seed = 11, t = 0, gente = []; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280, pick = arr => arr[Math.floor(rnd() * arr.length)];
  const FR = ['a conta de TI não fecha e o CFO precisa de resposta em semanas', 'o ERP travou e a reforma tributária não espera', 'o fundo quer saber quanto a tecnologia vale antes de assinar', 'quer alguém olhando a TI com ele todo mês', 'o CIO saiu e a área precisa de comando', 'quer provar o retorno da IA para o conselho', ''];
  const PAP = [[30, 20, 15, 10, 10, 5, 10], [35, 25, 10, 10, 5, 5, 10], [40, 15, 15, 10, 5, 5, 10], [25, 20, 20, 15, 10, 0, 10]], PAPI = [[20, 15, 25, 20, 10, 5, 5], [25, 20, 20, 15, 10, 5, 5], [15, 15, 30, 20, 10, 5, 5], [20, 10, 25, 25, 10, 10, 0]];
  const NUC = ['adv1', 'adv3', 'adv4', 'adv6', 'adv8', 'trf1', 'trf3', 'trf4', 'ma1', 'ma2', 'ma3', 'ma4', 'ma5', 'mod2', 'mod4', 'mod5', 'mod9'];
  function pessoa(i) {
    const porta = clamp(44 + (rnd() - .5) * 75), foco = clamp(70 + (rnd() - .5) * 60);
    const rx = Object.fromEntries(REFLEX.map(r => { const v = r.dim === 'PORTA' ? porta : r.dim === 'FOCO' ? foco : clamp(DIMS[r.dim].plan + (rnd() - .5) * 110); return [r.id, rnd() < .07 ? { side: null, ms: null, hesitou: true } : { side: Math.abs(r.vL - v) < Math.abs(r.vR - v) ? 'L' : 'R', ms: Math.round(1500 + rnd() * 9000) }]; }));
    const calls = CALLS.map(c => c.id).sort(() => rnd() - .5), anc = ['tempo', 'tempo', 'tempo', 'ferramenta', 'ferramenta', 'gtm', 'oferta', 'treino', 'coach', 'provas', 'gente']; const a1 = pick(anc); let a2 = pick(anc); while (a2 === a1) a2 = pick(anc);
    const a = { rx, rota: pick(['B', 'B', 'B', 'A', 'C']), mesa: pick([[30, 35, 20, 10, 5], [20, 40, 25, 10, 5], [25, 30, 25, 10, 10], [10, 25, 15, 30, 20], [35, 35, 20, 5, 5]]), tel: { atender: calls.slice(0, 3), postal: calls[5] }, contrato: { v: Math.round(clamp(62 + (rnd() - .5) * 90) / 5) * 5, moves: 2 },
      ia: pick(['b', 'b', 'b', 'c', 'a', 'd']), prio: PRIO.map(x => x.id).sort(() => rnd() - .5), carga: PRODUTOS.filter(x => rnd() < (NUC.includes(x.id) ? .86 : .3)).map(x => x.id), cargaNova: rnd() < .3 ? [pick(['Governança e valor de IA', 'Radar das investidas', 'Tech para private equity'])] : [],
      vento: pick([1, 2, 2, 2, 3, 3, 4]), ancoras: [a1, a2], papel: { hoje: pick(PAP), ideal: pick(PAPI) }, casco: [4, 3, 3, 2, 4].map(v => clamp(Math.round(v + (rnd() - .5) * 2.4), 1, 5)), espelho: pick(['C', 'C', 'A', 'B', 'C', 'A']), frase: pick(FR) };
    const x = Math.round(porta - 50), y = Math.round(foco - 50), q = quadOf(x, y);
    const dims = { PORTA: porta, FOCO: foco, RECEITA: a.contrato.v, PRODUTO: clamp(70 + (rnd() - .5) * 60), IA: a.ia === 'b' ? 95 : a.ia === 'c' ? 50 : 20, FABRICA: clamp(75 + (rnd() - .5) * 60), ANCORAS: clamp(70 + (rnd() - .5) * 60), PILARES: clamp(78 + (rnd() - .5) * 40), CONSOL: clamp(100 - Math.abs(a.carga.length - 23) * 6) };
    const ms = Object.values(rx).filter(v => v.side).map(v => v.ms);
    return { id: 'demo-' + i, nome: 'Comandante ' + (1000 + Math.floor(rnd() * 8999)).toString(36).toUpperCase(), a, x, y, q, dims, ader: Math.round(Object.keys(DIMS).reduce((s, k) => s + DIMS[k].w * (100 - Math.abs(dims[k] - DIMS[k].plan)), 0)), vel: median(ms) / 1000, hes: Object.values(rx).filter(v => !v.side).length, conv: Math.round(40 + rnd() * 55), passo: -1 - Math.floor(rnd() * 7), dur: Math.round(520 + rnd() * 420) };
  }
  return { linhas() {
    if (!gente.length) gente = Array.from({ length: 14 }, (_, i) => pessoa(i));
    t++; const ST = ['capa', 'rx_intro', ...DEC_ORDER, 'final'];
    gente.forEach(g => { if (g.passo < ST.length - 1) g.passo += rnd() < .85 ? 1 : 0; });
    return gente.filter(g => g.passo >= 0).map(g => { const et = ST[Math.min(g.passo, ST.length - 1)], done = et === 'final';
      return Object.assign({ sessionId: g.id, nome: g.nome, status: done ? 'concluída' : 'em andamento', etapa: et, _a: g.a, atualizadoEm: new Date().toISOString() },
        done ? { arquetipo: ARQUETIPOS[g.q].nome, x: g.x, y: g.y, opiniaoFormada: g.conv, aderencia: g.ader, velocidadeMed: g.vel, hesitacoes: g.hes, duracaoSeg: g.dur, ...g.dims } : {}); });
  } };
})();

/* ---------------- início ---------------- */
const IC = { lixo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>', full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>', ref: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>', copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>' };
try { if (localStorage.getItem('mostrador-tema') === 'escuro') document.documentElement.dataset.tema = 'escuro'; } catch (e) { }
$('#acts').innerHTML = `<button data-c="ref">${IC.ref}Atualizar</button><button class="zera" data-c="zera">${IC.lixo}Limpar resultados</button>`;
$('#ctl').innerHTML = `<button data-c="copy">${IC.copy}Copiar diagnóstico</button><button data-c="limpa" title="Apagar as marcações e ações acrescentadas no plano">Limpar plano</button><button data-c="tema" title="Alternar tema claro e escuro">Tema</button><button data-c="full">${IC.full}Tela cheia</button>`;
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-c]');
  if (c) { const k = c.dataset.c;
    if (k === 'ref') { c.disabled = true; await ciclo(); c.disabled = false; avisar(ultimaOk && Date.now() - ultimaOk < 5000 ? '↻ Atualizado agora' : 'Não consegui ler a planilha agora'); }
    if (k === 'zera') limparResultados(c);
    if (k === 'tema') { const r = document.documentElement, t = r.dataset.tema === 'escuro' ? '' : 'escuro'; if (t) r.dataset.tema = t; else delete r.dataset.tema; try { localStorage.setItem('mostrador-tema', t); } catch (er) { } }
    if (k === 'plano') abrirPlano(0);
    if (k === 'limpa' && confirm('Apagar as marcações e as ações acrescentadas no plano de ação?')) { planoEst = { marca: {}, extra: { tipo: [], foco: [], venda: [], time: [] } }; guardaPlano(); desenhar(); }
    if (k === 'aba') abrirPlano(+c.dataset.i);
    if (k === 'fecha-plano') $('#plano').classList.remove('on');
    if (k === 'copia-plano') { const txt = textoPlanoTime(); try { await navigator.clipboard.writeText(txt); } catch (er) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } avisar('📋 Plano de ação copiado'); }
    if (k === 'full') { const s = $('#stage'); document.fullscreenElement ? document.exitFullscreen() : (s.requestFullscreen ? s.requestFullscreen() : null); }
    if (k === 'copy') { const txt = diagnostico(A).titulo + '\n\n' + textoPlanoTime(); try { await navigator.clipboard.writeText(txt); } catch (er) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } avisar('📋 Diagnóstico copiado em texto'); }
    return; }
  const ac = e.target.closest('[data-ac]'); if (ac) { const k = ac.dataset.ac, m = planoEst.marca[k]; planoEst.marca[k] = !m ? 'ok' : m === 'ok' ? 'nao' : ''; guardaPlano(); abrirPlano(); desenharSemPlano(); return; }
  const g = e.target.closest('[data-g]');
  if (g) { if (g.dataset.g === 'ok') conectar(); if (g.dataset.g === 'demo') { fonte = 'demo'; $('#gate').classList.add('off'); arrancar(); } }
});
document.addEventListener('keydown', e => { if (e.target && e.target.classList && e.target.classList.contains('nova')) { if (e.key === 'Enter' && e.target.value.trim()) { planoEst.extra[e.target.dataset.fr].push(e.target.value.trim()); guardaPlano(); abrirPlano(); desenharSemPlano(); } return; } if (e.key === 'Escape') $('#plano').classList.remove('on'); if (e.target && e.target.id === 'gsenha') { if (e.key === 'Enter') conectar(); return; } if (e.key.toLowerCase() === 'f') $('#ctl [data-c="full"]').click(); });
let cicloT = null;
function arrancar() { clearInterval(cicloT); ciclo(); cicloT = setInterval(ciclo, (fonte === 'demo' ? 2.5 : Math.max(4, MC.intervaloSeg || 8)) * 1000); }
setInterval(status, 1000);
desenhar(); status(); arrancar();
</script>
