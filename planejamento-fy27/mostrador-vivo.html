<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostrador vivo · Bússola DTS 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Kalam:wght@400;700&family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@500;600;700&display=swap">
<!-- =====================================================================
     MOSTRADOR VIVO · o painel de resultados para projetar no encontro
     Lê a mesma planilha da bússola (Apps Script) e se atualiza sozinho.
     Abra este arquivo no computador do projetor, digite a senha do painel
     (o TOKEN do Codigo.gs) e deixe na tela. Não envie este arquivo aos diretores.
     ===================================================================== -->
<script id="mostrador-config">
  window.MOSTRADOR_CONFIG = {
    sheetsEndpoint: 'https://script.google.com/macros/s/AKfycbxEJxSQi9gT5BWQWhPkEl3NQW_EIAg0W65EDpOe59HN6wjx4Zvxf2fsPJIX7Z7j_WW4VA/exec',   // o mesmo link /exec da bússola
    painelToken: '',      // deixe vazio: a senha é digitada na tela e fica só neste computador
    intervaloSeg: 8,      // de quantos em quantos segundos ler a planilha
    rotacaoSeg: 25        // tempo de cada página na rotação automática
  };
</script>
<style>
:root{
  --navy:#002B49; --navy-80:#33556D; --navy-40:#99AAB6; --navy-20:#CCD5DB;
  --steel:#5E8AB4; --blue-80:#7EA1C3; --blue-40:#BFD0E1; --ice:#DFE8F0;
  --peach:#FCD1A2; --orange:#F78C16; --rust:#B4570A; --green:#9ACC3C; --yellow:#F9C20A; --red:#CF3D3D;
  --line:rgba(191,208,225,.16); --card:rgba(255,255,255,.035);
  --serif:'Zilla Slab',Georgia,serif; --sans:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Courier Prime',ui-monospace,Menlo,monospace; --hand:'Kalam','Comic Sans MS',cursive; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020d18;color:var(--ice);font-family:var(--sans)}
body{display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;container-type:size;overflow:hidden;background:radial-gradient(110% 80% at 15% -10%,#0d3a5e 0%,#05203a 45%,#020d18 100%)}
.ui{position:absolute;inset:0;font-size:2.15cqh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:.9em;padding:1.3em 2em .9em}

.hd{display:flex;align-items:center;justify-content:space-between;gap:1.5em}
.brand .eyebrow{font:700 .6em var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--blue-40)}
.brand .eyebrow b{color:var(--peach)}
.brand h1{display:flex;align-items:center;gap:.6em;margin-top:.15em;font-family:var(--serif);font-weight:700;font-size:1.45em;line-height:1;color:#fff}
.live{display:inline-flex;align-items:center;gap:.45em;font:700 .42em var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--peach);border:1px solid rgba(252,209,162,.45);border-radius:99px;padding:.45em .9em .4em}
.live i{width:.8em;height:.8em;border-radius:50%;background:var(--orange);animation:pulse 1.6s infinite}
.live.off{color:var(--navy-40);border-color:var(--line)}.live.off i{background:var(--navy-40);animation:none}
.live.demo{color:var(--blue-40);border-color:rgba(191,208,225,.45)}.live.demo i{background:var(--blue-80)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(247,140,22,.6)}70%{box-shadow:0 0 0 .7em rgba(247,140,22,0)}100%{box-shadow:0 0 0 0 rgba(247,140,22,0)}}
.count{display:flex;gap:1.6em;align-items:baseline}
.hdr{display:flex;align-items:center;gap:1.4em}
.acts{display:flex;flex-direction:column;gap:.35em}
.acts button{display:inline-flex;align-items:center;gap:.45em;height:2.1em;padding:0 .9em;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:.62em;font-weight:600;color:var(--ice);white-space:nowrap}
.acts button:hover{color:#fff;border-color:var(--peach)}
.acts button svg{width:1.15em;height:1.15em}
.acts button.zera:hover{border-color:var(--red);color:#fff;background:rgba(207,61,61,.18)}
.acts button[disabled]{opacity:.5;pointer-events:none}

.ct{display:flex;align-items:baseline;gap:.4em}
.ct b{font-family:var(--serif);font-weight:700;font-size:2.3em;line-height:1;color:#fff}
.ct span{font:700 .58em var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--blue-40)}
.ct.hi b{color:var(--peach)}

.headline{border-left:4px solid var(--orange);padding:.15em 0 .2em 1em}
.headline .eb{font:700 .58em var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--peach)}
.headline h2{font-family:var(--serif);font-weight:700;font-size:2.35em;line-height:1.04;color:#fff;margin-top:.12em}
.headline p{font-size:.9em;line-height:1.4;color:var(--blue-40);margin-top:.3em}
.headline p b{color:#fff}

.qs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:.8em;min-height:0}
.qc{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:0 .9em;align-content:start;padding:.85em 1.2em .8em;border:1px solid var(--line);border-radius:14px;background:var(--card);min-height:0;overflow:hidden}
.qc .nb{grid-row:1/5;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font:700 .95em var(--mono);color:var(--navy);background:var(--peach)}
.qc .qq{font:700 .62em var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--blue-40);display:flex;justify-content:space-between;gap:1em}
.qc .qq span{color:var(--navy-40);letter-spacing:.08em}
.qc .ans{font-family:var(--serif);font-weight:700;font-size:1.68em;line-height:1.08;color:#fff;margin-top:.22em}
.qc .ans em{font-style:normal;color:var(--peach)}
.qc .fact{font-size:.8em;line-height:1.4;color:var(--ice);margin-top:.35em}
.qc .fact b{color:#fff}
.qc .viz{margin-top:.6em}
.qc .wait{font-family:var(--hand);font-size:1.05em;color:var(--navy-40);margin-top:.6em}

.stk{display:flex;height:1.1em;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.06)}
.stk i{display:block;height:100%;transition:flex-grow 1.1s var(--ease)}
.stk-l{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:.35em;font:700 .52em var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--blue-40)}
.stk-l span:nth-child(2){text-align:center;color:var(--peach)}.stk-l span:last-child{text-align:right}
.bars{display:flex;flex-direction:column;gap:.28em}
.bar{display:grid;grid-template-columns:var(--lw,11em) minmax(0,1fr) 2.8em;align-items:center;gap:.7em;font-size:.72em}
.bar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--blue-40)}
.bar.top>span:first-child{color:#fff;font-weight:700}
.bar .v{font-family:var(--serif);font-weight:700;color:#fff;text-align:right}
.tr{position:relative;height:.6em;border-radius:99px;background:rgba(255,255,255,.07)}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--steel);width:var(--to);animation:grow 1.1s var(--ease)}
.tr i.hi{background:#fff}
.tr em{position:absolute;top:-.3em;bottom:-.3em;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--orange);left:var(--p)}
@keyframes grow{from{width:var(--from)}}
.dots{display:flex;gap:1.1em}
.dots div{display:flex;flex-direction:column;align-items:center;gap:.25em;font:700 .5em var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--blue-40)}
.dots i{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font:700 1.9em var(--serif);font-style:normal;color:var(--navy)}

.plen{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:1em;align-items:start;padding:.8em 1.2em;border:1px solid rgba(247,140,22,.5);border-radius:14px;background:rgba(247,140,22,.05)}
.plen .k{font:700 .6em var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--peach);padding-top:.25em;white-space:nowrap}
.plen div{display:grid;grid-template-columns:1.5em 1fr;gap:.55em;font-size:.76em;line-height:1.35;color:var(--ice)}
.plen div b.n{display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--orange);color:var(--navy);font:700 .85em var(--mono)}
.plen div span b{color:#fff}

.ft{display:flex;align-items:center;justify-content:space-between;gap:1em}
.ft .st{font-size:.58em;color:var(--navy-40)}
.ctl{display:flex;gap:.45em}
.ctl button{display:inline-flex;align-items:center;gap:.4em;height:2em;padding:0 .8em;border-radius:7px;border:1px solid var(--line);font-size:.56em;font-weight:600;color:var(--blue-40)}
.ctl button:hover{color:#fff;border-color:var(--peach)}
.ctl button svg{width:1.2em;height:1.2em}

.toast{position:absolute;left:50%;top:1.1em;transform:translate(-50%,.6em);opacity:0;pointer-events:none;z-index:5;padding:.55em 1.1em;border-radius:99px;background:rgba(2,13,24,.92);border:1px solid rgba(247,140,22,.6);font-size:.8em;color:#fff;transition:all .5s var(--ease);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--peach)}
.banner{position:absolute;left:50%;bottom:3.4em;transform:translateX(-50%);z-index:5;padding:.45em 1em;border-radius:8px;background:rgba(207,61,61,.2);border:1px solid rgba(207,61,61,.6);font-size:.66em;color:#fff;display:none}
.banner.on{display:block}
.gate{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(2,13,24,.78);backdrop-filter:blur(4px)}
.gate.off{display:none}
.gcard{width:min(30em,90%);padding:1.4em 1.5em;border-radius:14px;background:#F3ECDC;color:#18324a;box-shadow:0 1.4em 3em rgba(0,0,0,.55)}
.gcard .k{font:700 .62em var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--rust)}
.gcard h2{font-family:var(--serif);font-size:1.5em;color:var(--navy);margin:.3em 0 .35em;line-height:1.1}
.gcard p{font-size:.78em;line-height:1.45;color:#33556D}
.gcard input{width:100%;margin-top:.8em;font:inherit;font-size:.9em;padding:.6em .8em;border-radius:8px;border:1px solid var(--navy-40);background:#fff;color:var(--navy)}
.gcard .row{display:flex;gap:.6em;justify-content:flex-end;margin-top:1em;flex-wrap:wrap}
.gcard .row button{height:2.5em;padding:0 1.1em;border-radius:8px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;font-size:.8em}
.gcard .row .go{background:var(--navy);color:#fff}
.gcard .msg{min-height:1.3em;margin-top:.6em;font-size:.72em;color:var(--red)}
.plen{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.plen .pt{display:block;font-size:.82em;color:var(--ice)}.plen .pt b{color:#fff;font-family:var(--serif)}
.plen .abre{height:2.3em;padding:0 1.2em;border-radius:8px;background:var(--orange);color:var(--navy);font-weight:700;font-size:.82em;white-space:nowrap}
.plen .abre:hover{background:#ffa033}
.plano{position:absolute;inset:0;z-index:8;display:none;place-items:center;padding:1.2em 1.6em;background:radial-gradient(110% 80% at 15% -10%,#0b3150 0%,#04182a 50%,#020d18 100%);backdrop-filter:blur(4px);font-size:2.05cqh}
.plano.on{display:grid}
.pl{display:flex;flex-direction:column;gap:.7em;width:100%;height:100%;min-height:0}
.plh{display:flex;justify-content:space-between;gap:1em;align-items:flex-start}
.plh .eb{font:700 .6em var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--peach)}
.plh h2{font-family:var(--serif);font-size:1.8em;color:#fff;line-height:1.05;margin:.1em 0 .15em}
.plh p{font-size:.8em;color:var(--blue-40)}
.plh .x{width:1.9em;height:1.9em;border-radius:50%;border:1.5px solid var(--line);color:#fff;font-size:1.2em}
.plg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7em}
.plg section{display:flex;flex-direction:column;gap:.5em;padding:.8em .9em;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:0;overflow:auto}
.plg .fh{display:flex;gap:.6em;align-items:flex-start}
.plg .nb{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;font:700 .85em var(--mono);color:var(--navy);background:var(--peach)}
.plg .fq{display:block;font:700 .54em var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-40)}
.plg .fh b{font-family:var(--serif);font-size:1.05em;line-height:1.15;color:#fff}
.plg .ev{list-style:none;display:flex;flex-direction:column;gap:.3em}
.plg .ev li{font-size:.66em;line-height:1.35;color:var(--blue-40);padding-left:.8em;border-left:2px solid var(--line)}
.plg .cv{font-family:var(--serif);font-weight:600;font-size:.8em;line-height:1.3;color:var(--peach)}
.acs{display:flex;flex-direction:column;gap:.35em;margin-top:auto}
.acao{text-align:left;font-size:.68em;line-height:1.35;padding:.5em .65em .5em 2.1em;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ice);position:relative}
.acao::before{content:"";position:absolute;left:.65em;top:.55em;width:.95em;height:.95em;border-radius:3px;border:1.5px solid var(--blue-80)}
.acao.ok{border-color:rgba(154,204,60,.7);background:rgba(154,204,60,.12);color:#fff}.acao.ok::before{background:var(--green);border-color:var(--green)}
.acao.nao{opacity:.45;text-decoration:line-through}.acao.nao::before{border-color:var(--red);background:rgba(207,61,61,.4)}
.nova{font:inherit;font-size:.66em;padding:.5em .65em;border-radius:8px;border:1px dashed rgba(191,208,225,.4);background:transparent;color:#fff}
.nova::placeholder{color:var(--navy-40)}
.plf{display:flex;align-items:center;justify-content:space-between;gap:1em}
.plf .id{display:flex;flex-wrap:wrap;gap:.3em .9em;align-items:baseline;font-size:.68em;color:var(--ice)}
.plf .id b{font:700 .9em var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--peach)}
.plf .id .vz{color:var(--navy-40)}
.plf button{height:2.2em;padding:0 1em;border-radius:8px;border:1px solid var(--line);color:#fff;font-size:.72em;font-weight:600}
.plx{display:flex;gap:.5em;align-items:center}
.plx button[data-c="copia-plano"]{height:2.2em;padding:0 1em;border-radius:8px;border:1px solid var(--line);color:#fff;font-size:.72em;font-weight:600}
.pl .sw-tabs{display:flex;gap:.3em;border-bottom:1px solid var(--line)}
.pl .sw-tabs button{display:flex;align-items:center;gap:.45em;padding:.5em .85em;font-size:.78em;font-weight:600;color:var(--blue-40);border-bottom:3px solid transparent;margin-bottom:-1px}
.pl .sw-tabs button span{display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;font:700 .85em var(--mono);background:rgba(255,255,255,.08);color:var(--ice)}
.pl .sw-tabs button.on{color:#fff;border-bottom-color:var(--orange,#F78C16)}
.pl .sw-tabs button.on span{background:var(--peach);color:var(--navy)}
.plb{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.7em}
.plb .plg{flex:1}
.pl .sw-n{flex:none;display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;font:700 .72em var(--mono);background:var(--peach);color:var(--navy);vertical-align:middle}
.pl .sw-vz{font-size:.74em;color:var(--navy-40);font-style:italic}
.pl .sw-q{display:block;font:700 .56em var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-40)}
.pl .sw-somos{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:.7em}
.pl .sw-somos article{display:flex;gap:.8em;padding:1em 1.1em;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.pl .sw-somos b{display:block;font-family:var(--serif);font-size:1.45em;line-height:1.15;color:#fff;margin:.15em 0 .4em}
.pl .sw-somos p{font-size:1.08em;line-height:1.45;color:var(--ice)}
.pl .sw-somos .sw-cmp{margin-top:.7em;font-size:.76em;color:var(--blue-40);border-left:2px solid var(--peach);padding-left:.6em}
.pl .sw-somos .sw-cmp i{font:700 .9em var(--mono);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--peach);margin-right:.3em}
.pl .sw-gp{flex:1;display:grid;grid-template-rows:auto repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.pl .sw-gh,.pl .sw-gr{display:grid;grid-template-columns:1fr 1.4fr 1.4fr;gap:1.2em;padding:.75em 1.1em;align-items:center}
.pl .sw-gh{background:rgba(255,255,255,.05);font:700 .62em var(--mono);letter-spacing:.14em;text-transform:uppercase}
.pl .sw-gh .g{color:var(--green)}.pl .sw-gh .p{color:#F08A8A}
.pl .sw-gr+.sw-gr{border-top:1px solid var(--line)}
.pl .sw-gr>div{display:flex;gap:.6em;align-items:flex-start}
.pl .sw-gr b{font-family:var(--serif);font-size:1em;line-height:1.2;color:#fff}
.pl .sw-gr p{font-size:.9em;line-height:1.45;color:var(--ice);padding-left:.7em}
.pl .sw-gr p.g{border-left:3px solid var(--green)}.pl .sw-gr p.p{border-left:3px solid var(--red)}
.pl .sw-ff{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:.7em;min-height:0}
.pl .sw-col{padding:.9em 1.1em;border-radius:12px;border:1px solid var(--line);background:var(--card);border-top:4px solid var(--green);overflow:auto}
.pl .sw-col.w{border-top-color:var(--red)}
.pl .sw-col h4{font:700 .66em var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#fff;margin-bottom:.6em}
.pl .sw-col ul{list-style:none;display:flex;flex-direction:column;gap:.8em}
.pl .sw-col li{display:flex;gap:.6em;align-items:flex-start;font-size:.95em;line-height:1.4;color:var(--ice)}
.pl .sw-leg{font-size:.62em;color:var(--blue-40)}
@media (max-aspect-ratio:4/3){.stage{width:100vw;height:100vh;aspect-ratio:auto}.qs{grid-template-columns:1fr;grid-template-rows:none}.plen{grid-template-columns:1fr}.ui{overflow:auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.ctl,.gate,.toast,.banner{display:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="ui">
    <header class="hd">
      <div class="brand"><div class="eyebrow">Alvarez &amp; Marsal · DTS · <b>Bússola 2027</b></div><h1>Resultado ao vivo <span class="live off" id="live"><i></i><span id="liveTxt">conectando</span></span></h1></div>
      <div class="hdr"><div class="count" id="count"></div><div class="acts" id="acts"></div></div>
    </header>
    <section class="headline" id="headline"></section>
    <main class="qs" id="qs"></main>
    <section class="plen" id="plen"></section>
    <footer class="ft"><span class="st" id="st"></span><div class="ctl" id="ctl"></div></footer>
  </div>
  <div class="toast" id="toast"></div>
  <div class="banner" id="banner"></div>
  <div class="plano" id="plano"></div>
  <div class="gate off" id="gate"></div>
</div>
<script>
/* constantes do modelo, copiadas da bússola no build (mesma fonte) */
/* ===================================================================== */
/* 1 · MODELO: dimensões, posição do planejamento e os itens             */
/* ===================================================================== */
const VERSION = 'bussola-dts-3';
const CFG = window.BUSSOLA_CONFIG || {};
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;
const median = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  $('#plen').innerHTML = `<span class="k">Plano de ação</span><div class="pt">${nAc ? `<b>${nAc}</b> ações sugeridas a partir das respostas${aprov ? ` · <b>${aprov}</b> aprovadas` : ''}${ideias ? ` · <b>${ideias}</b> ideias dos diretores` : ''}. O time decide estas e outras.` : 'As sugestões aparecem quando as respostas chegarem.'}</div><button class="abre" data-c="plano">Abrir o plano de ação →</button>`;
  if ($('#plano').classList.contains('on')) abrirPlano();
  contarAnimado(document);
  A.done.forEach(p => vistos.add(p.id));
}
function desenharSemPlano() { const on = $('#plano').classList.contains('on'); $('#plano').classList.remove('on'); desenhar(); if (on) $('#plano').classList.add('on'); }
let toastQ = [], toastOn = false;
function avisar(html) { toastQ.push(html); if (!toastOn) proximoAviso(); }
function proximoAviso() { const t = $('#toast'), h = toastQ.shift(); if (!h) { toastOn = false; return; } toastOn = true; t.innerHTML = h; t.classList.add('on'); setTimeout(() => { t.classList.remove('on'); setTimeout(proximoAviso, 500); }, 3200); }

/* ---------------- leitura da planilha ---------------- */
let ultimaOk = 0, fonte = DEMO ? 'demo' : 'planilha';
const senha = () => MC.painelToken || (() => { try { return localStorage.getItem('mostrador-senha') || ''; } catch (e) { return ''; } })();
async function ler() {
  const u = String(MC.sheetsEndpoint || '').trim(); if (!/^https:\/\//.test(u)) throw Object.assign(new Error('Este arquivo não tem o link da planilha (sheetsEndpoint).'), { cfg: true });
  const tk = senha(); if (!tk) throw Object.assign(new Error('Digite a senha do painel.'), { auth: true });
  const res = await fetch(u + '?painel=1&token=' + encodeURIComponent(tk) + '&t=' + Date.now(), { cache: 'no-store' });
  const d = await res.json(); if (d && d.erro) throw Object.assign(new Error(d.erro === 'token inválido' ? 'Senha do painel incorreta.' : d.erro), { auth: /token|TOKEN/i.test(d.erro) });
  if (!d || !Array.isArray(d.linhas)) throw new Error('Resposta inesperada da planilha.');
  return d.linhas;
}
let desde = (() => { try { return +localStorage.getItem('mostrador-desde') || 0; } catch (e) { return 0; } })();
function aplicar(rows) {
  if (desde && fonte !== 'demo') rows = rows.filter(r => (Date.parse(r.atualizadoEm || r.concluidoEm || r.iniciadoEm || '') || 0) >= desde);
  const P = participantes(rows), sig = JSON.stringify(P.map(p => [p.id, p.etapa, p.done, p.ts]));
  const novos = P.filter(p => p.done && !vistos.has(p.id)), antes = new Set(A.P.map(p => p.id));
  if (!primeiraLeitura) { novos.forEach(p => avisar(`⚓ Nova agulha no mostrador · <b>${esc(p.arq || 'bússola concluída')}</b>`)); P.filter(p => !p.done && !antes.has(p.id)).forEach(() => avisar('⛵ Mais um comandante soltou as amarras')); }
  A = contar(P); if (sig !== assinatura) { assinatura = sig; desenhar(); }
  primeiraLeitura = false;
}
async function limparResultados(btn) {
  const n = A.n;
  if (fonte === 'demo') { if (confirm('Recomeçar a simulação do zero?')) location.reload(); return; }
  if (!confirm(`Limpar os resultados do mostrador?\n\n${n ? `As ${n} resposta${n > 1 ? 's' : ''} de agora saem` : 'As respostas de agora saem'} da tela e da aba Respostas e vão para a aba "Arquivo" da planilha. Nada é apagado.\n\nUse antes de começar com os diretores, para tirar os testes.`)) return;
  btn.disabled = true; let srv = null;
  try { const res = await fetch(String(MC.sheetsEndpoint).trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ tipo: 'limpar', token: senha() }) }); srv = await res.json(); } catch (e) { srv = null; }
  btn.disabled = false;
  if (srv && srv.limpo) { desde = 0; try { localStorage.removeItem('mostrador-desde'); } catch (e) { } avisar(`🧹 Resultados limpos · ${srv.arquivadas} resposta${srv.arquivadas === 1 ? '' : 's'} na aba Arquivo`); }
  else if (srv && /senha/.test(srv.erro || '')) { avisar('Senha do painel incorreta: nada foi limpo'); return; }
  else { desde = Date.now(); try { localStorage.setItem('mostrador-desde', String(desde)); } catch (e) { } avisar('🧹 Zerado nesta tela. A planilha não foi limpa: cole o Codigo.gs novo e implante uma nova versão'); }
  A = contar([]); assinatura = ''; vistos.clear(); primeiraLeitura = true; desenhar(); ciclo();
}
async function ciclo() {
  try { const rows = fonte === 'demo' ? Demo.linhas() : await ler(); aplicar(rows); ultimaOk = Date.now(); $('#banner').classList.remove('on'); $('#gate').classList.add('off'); }
  catch (e) { if (e.auth || e.cfg) { portao(e.message); } else { $('#banner').textContent = 'Sem conexão com a planilha: mostrando os últimos dados. ' + (e.message || ''); $('#banner').classList.add('on'); } }
  status();
}
function status() { const l = $('#live'), age = ultimaOk ? Math.round((Date.now() - ultimaOk) / 1000) : null; l.className = 'live ' + (fonte === 'demo' ? 'demo' : age != null && age < 40 ? '' : 'off'); $('#liveTxt').textContent = fonte === 'demo' ? 'simulação' : age == null ? 'conectando' : age < 40 ? 'ao vivo' : 'sem sinal';
  const s = $('#st'); if (s) s.textContent = fonte === 'demo' ? 'Simulação com dados fictícios, para ensaio' : age == null ? 'Lendo a planilha…' : `Dados da planilha · atualizado há ${age} s${desde ? ` · contando desde ${new Date(desde).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : ''} · cada pergunta conta quem já passou por ela`; }
function portao(msg) {
  const g = $('#gate'); g.classList.remove('off');
  g.innerHTML = `<div class="gcard"><div class="k">Mostrador vivo · conexão</div><h2>Ligar o mostrador à planilha</h2><p>Digite a senha do painel (o TOKEN do Codigo.gs). Ela fica guardada só neste computador. Para ensaiar sem dados, veja a simulação.</p><input id="gsenha" type="password" autocomplete="off" placeholder="Senha do painel"><div class="msg">${esc(msg || '')}</div><div class="row"><button data-g="demo">Ver simulação</button><button class="go" data-g="ok">Conectar</button></div></div>`;
  setTimeout(() => { const i = $('#gsenha'); if (i) i.focus(); }, 50);
}
function conectar() { const v = ($('#gsenha') || {}).value; if (!v) return; try { localStorage.setItem('mostrador-senha', v.trim()); } catch (e) { } fonte = 'planilha'; ultimaOk = 0; $('#gate').classList.add('off'); ciclo(); }

/* ---------------- simulação para ensaio (dados fictícios) ---------------- */
const Demo = (() => {
  let seed = 11, t = 0, gente = []; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280, pick = arr => arr[Math.floor(rnd() * arr.length)];
  const FR = ['a conta de TI não fecha e o CFO precisa de resposta em semanas', 'o ERP travou e a reforma tributária não espera', 'o fundo quer saber quanto a tecnologia vale antes de assinar', 'quer alguém olhando a TI com ele todo mês', 'o CIO saiu e a área precisa de comando', 'quer provar o retorno da IA para o conselho', ''];
  const PAP = [[30, 20, 15, 10, 10, 5, 10], [35, 25, 10, 10, 5, 5, 10], [40, 15, 15, 10, 5, 5, 10], [25, 20, 20, 15, 10, 0, 10]], PAPI = [[20, 15, 25, 20, 10, 5, 5], [25, 20, 20, 15, 10, 5, 5], [15, 15, 30, 20, 10, 5, 5], [20, 10, 25, 25, 10, 10, 0]];
  const NUC = ['adv1', 'adv3', 'adv4', 'adv6', 'adv8', 'trf1', 'trf3', 'trf4', 'ma1', 'ma2', 'ma3', 'ma4', 'ma5', 'mod2', 'mod4', 'mod5', 'mod9'];
  function pessoa(i) {
    const porta = clamp(44 + (rnd() - .5) * 75), foco = clamp(70 + (rnd() - .5) * 60);
    const rx = Object.fromEntries(REFLEX.map(r => { const v = r.dim === 'PORTA' ? porta : r.dim === 'FOCO' ? foco : clamp(DIMS[r.dim].plan + (rnd() - .5) * 110); return [r.id, rnd() < .07 ? { side: null, ms: null, hesitou: true } : { side: Math.abs(r.vL - v) < Math.abs(r.vR - v) ? 'L' : 'R', ms: Math.round(1500 + rnd() * 9000) }]; }));
    const calls = CALLS.map(c => c.id).sort(() => rnd() - .5), anc = ['tempo', 'tempo', 'tempo', 'ferramenta', 'ferramenta', 'gtm', 'oferta', 'treino', 'coach', 'provas', 'gente']; const a1 = pick(anc); let a2 = pick(anc); while (a2 === a1) a2 = pick(anc);
    const a = { rx, rota: pick(['B', 'B', 'B', 'A', 'C']), mesa: pick([[30, 35, 20, 10, 5], [20, 40, 25, 10, 5], [25, 30, 25, 10, 10], [10, 25, 15, 30, 20], [35, 35, 20, 5, 5]]), tel: { atender: calls.slice(0, 3), postal: calls[5] }, contrato: { v: Math.round(clamp(62 + (rnd() - .5) * 90) / 5) * 5, moves: 2 },
      ia: pick(['b', 'b', 'b', 'c', 'a', 'd']), prio: PRIO.map(x => x.id).sort(() => rnd() - .5), carga: PRODUTOS.filter(x => rnd() < (NUC.includes(x.id) ? .86 : .3)).map(x => x.id), cargaNova: rnd() < .3 ? [pick(['Governança e valor de IA', 'Radar das investidas', 'Tech para private equity'])] : [],
      vento: pick([1, 2, 2, 2, 3, 3, 4]), ancoras: [a1, a2], papel: { hoje: pick(PAP), ideal: pick(PAPI) }, casco: [4, 3, 3, 2, 4].map(v => clamp(Math.round(v + (rnd() - .5) * 2.4), 1, 5)), espelho: pick(['C', 'C', 'A', 'B', 'C', 'A']), frase: pick(FR) };
    const x = Math.round(porta - 50), y = Math.round(foco - 50), q = quadOf(x, y);
    const dims = { PORTA: porta, FOCO: foco, RECEITA: a.contrato.v, PRODUTO: clamp(70 + (rnd() - .5) * 60), IA: a.ia === 'b' ? 95 : a.ia === 'c' ? 50 : 20, FABRICA: clamp(75 + (rnd() - .5) * 60), ANCORAS: clamp(70 + (rnd() - .5) * 60), PILARES: clamp(78 + (rnd() - .5) * 40), CONSOL: clamp(100 - Math.abs(a.carga.length - 23) * 6) };
    const ms = Object.values(rx).filter(v => v.side).map(v => v.ms);
    return { id: 'demo-' + i, nome: 'Comandante ' + (1000 + Math.floor(rnd() * 8999)).toString(36).toUpperCase(), a, x, y, q, dims, ader: Math.round(Object.keys(DIMS).reduce((s, k) => s + DIMS[k].w * (100 - Math.abs(dims[k] - DIMS[k].plan)), 0)), vel: median(ms) / 1000, hes: Object.values(rx).filter(v => !v.side).length, conv: Math.round(40 + rnd() * 55), passo: -1 - Math.floor(rnd() * 7), dur: Math.round(520 + rnd() * 420) };
  }
  return { linhas() {
    if (!gente.length) gente = Array.from({ length: 14 }, (_, i) => pessoa(i));
    t++; const ST = ['capa', 'rx_intro', ...DEC_ORDER, 'final'];
    gente.forEach(g => { if (g.passo < ST.length - 1) g.passo += rnd() < .85 ? 1 : 0; });
    return gente.filter(g => g.passo >= 0).map(g => { const et = ST[Math.min(g.passo, ST.length - 1)], done = et === 'final';
      return Object.assign({ sessionId: g.id, nome: g.nome, status: done ? 'concluída' : 'em andamento', etapa: et, _a: g.a, atualizadoEm: new Date().toISOString() },
        done ? { arquetipo: ARQUETIPOS[g.q].nome, x: g.x, y: g.y, opiniaoFormada: g.conv, aderencia: g.ader, velocidadeMed: g.vel, hesitacoes: g.hes, duracaoSeg: g.dur, ...g.dims } : {}); });
  } };
})();

/* ---------------- início ---------------- */
const IC = { lixo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>', full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>', ref: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>', copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>' };
$('#acts').innerHTML = `<button data-c="ref">${IC.ref}Atualizar</button><button class="zera" data-c="zera">${IC.lixo}Limpar resultados</button>`;
$('#ctl').innerHTML = `<button data-c="copy">${IC.copy}Copiar diagnóstico</button><button data-c="limpa" title="Apagar as marcações e ações acrescentadas no plano">Limpar plano</button><button data-c="full">${IC.full}Tela cheia</button>`;
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-c]');
  if (c) { const k = c.dataset.c;
    if (k === 'ref') { c.disabled = true; await ciclo(); c.disabled = false; avisar(ultimaOk && Date.now() - ultimaOk < 5000 ? '↻ Atualizado agora' : 'Não consegui ler a planilha agora'); }
    if (k === 'zera') limparResultados(c);
    if (k === 'plano') abrirPlano(0);
    if (k === 'limpa' && confirm('Apagar as marcações e as ações acrescentadas no plano de ação?')) { planoEst = { marca: {}, extra: { tipo: [], foco: [], venda: [], time: [] } }; guardaPlano(); desenhar(); }
    if (k === 'aba') abrirPlano(+c.dataset.i);
    if (k === 'fecha-plano') $('#plano').classList.remove('on');
    if (k === 'copia-plano') { const txt = textoPlanoTime(); try { await navigator.clipboard.writeText(txt); } catch (er) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } avisar('📋 Plano de ação copiado'); }
    if (k === 'full') { const s = $('#stage'); document.fullscreenElement ? document.exitFullscreen() : (s.requestFullscreen ? s.requestFullscreen() : null); }
    if (k === 'copy') { const txt = diagnostico(A).titulo + '\n\n' + textoPlanoTime(); try { await navigator.clipboard.writeText(txt); } catch (er) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } avisar('📋 Diagnóstico copiado em texto'); }
    return; }
  const ac = e.target.closest('[data-ac]'); if (ac) { const k = ac.dataset.ac, m = planoEst.marca[k]; planoEst.marca[k] = !m ? 'ok' : m === 'ok' ? 'nao' : ''; guardaPlano(); abrirPlano(); desenharSemPlano(); return; }
  const g = e.target.closest('[data-g]');
  if (g) { if (g.dataset.g === 'ok') conectar(); if (g.dataset.g === 'demo') { fonte = 'demo'; $('#gate').classList.add('off'); arrancar(); } }
});
document.addEventListener('keydown', e => { if (e.target && e.target.classList && e.target.classList.contains('nova')) { if (e.key === 'Enter' && e.target.value.trim()) { planoEst.extra[e.target.dataset.fr].push(e.target.value.trim()); guardaPlano(); abrirPlano(); desenharSemPlano(); } return; } if (e.key === 'Escape') $('#plano').classList.remove('on'); if (e.target && e.target.id === 'gsenha') { if (e.key === 'Enter') conectar(); return; } if (e.key.toLowerCase() === 'f') $('#ctl [data-c="full"]').click(); });
let cicloT = null;
function arrancar() { clearInterval(cicloT); ciclo(); cicloT = setInterval(ciclo, (fonte === 'demo' ? 2.5 : Math.max(4, MC.intervaloSeg || 8)) * 1000); }
setInterval(status, 1000);
desenhar(); status(); arrancar();
</script>
