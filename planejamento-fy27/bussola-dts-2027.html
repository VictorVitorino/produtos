<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bússola DTS 2027</title>
<meta name="description" content="Diagnóstico de engajamento para o planejamento FY27 do DTS (Alvarez & Marsal): sete minutos, dezoito manobras, uma bússola.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Kalam:wght@400;700&family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@500;600;700&display=swap">
<!-- =====================================================================
     BASE DE RESPOSTAS · GOOGLE PLANILHAS
     1. Crie uma planilha nova e cole o Apps Script de google-apps-script/Codigo.gs
        (passo a passo em google-apps-script/LEIAME.md).
     2. Implante como "App da Web" e cole abaixo o link que termina em /exec.
     Sem link, a bússola funciona igual e guarda as respostas só neste navegador.
     ===================================================================== -->
<script id="dts-config">
  window.BUSSOLA_CONFIG = {
    sheetsEndpoint: '',       // link do Apps Script (termina em /exec)
    painelToken: '',          // o mesmo TOKEN definido no Codigo.gs (o painel usa para ler as respostas ao vivo)
    mostrarAderencia: false   // true = o participante vê a aderência ao plano no final (recomendado: false)
  };
</script>
<style>
/* =====================================================================
   BÚSSOLA DTS 2027 · águas profundas
   Conceito: o comandante calibra a bússola antes de zarpar. Farol, mar,
   navio na rota, carta náutica. Paleta A&M: navy, aço, gelo e laranja.
   ===================================================================== */
:root{
  --abyss:#020b14; --deep:#041a2d; --navy:#002B49; --navy2:#0b3a5e; --steel:#5E8AB4; --steel-d:#33556D;
  --ice:#DFE8F0; --light-blue:#BFD0E1; --foam:#F5F7F8; --orange:#F78C16; --orange-d:#D9700A; --peach:#FCD1A2;
  --paper:#F3ECDC; --paper-2:#E9DFC7; --paper-line:rgba(0,43,73,.14); --ink:#002B49; --ink-2:#33556D; --rust:#9a3a26; --green:#2E8B6A;
  --serif:'Zilla Slab',Georgia,serif; --sans:'Libre Franklin',system-ui,sans-serif; --hand:'Kalam',cursive; --mono:'Courier Prime',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--abyss);color:var(--foam);font-family:var(--sans);font-size:17px;line-height:1.4;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
/* ---------- o mar (fundo fixo, em camadas) ---------- */
.sea{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#07192b 0%,#041a2d 38%,#031322 62%,#020b14 100%)}
.sky{position:absolute;inset:0 0 58% 0;background:radial-gradient(1200px 500px at 50% 110%,rgba(94,138,180,.22),transparent 60%)}
.stars{position:absolute;inset:0 0 55% 0;background-image:radial-gradient(1px 1px at 12% 30%,#fff 60%,transparent),radial-gradient(1px 1px at 28% 12%,#dfe8f0 60%,transparent),radial-gradient(1.5px 1.5px at 44% 38%,#fff 60%,transparent),radial-gradient(1px 1px at 61% 20%,#fff 60%,transparent),radial-gradient(1px 1px at 72% 44%,#bfd0e1 60%,transparent),radial-gradient(1.5px 1.5px at 86% 16%,#fff 60%,transparent),radial-gradient(1px 1px at 93% 36%,#fff 60%,transparent),radial-gradient(1px 1px at 6% 58%,#fff 60%,transparent),radial-gradient(1px 1px at 52% 6%,#fff 60%,transparent),radial-gradient(1px 1px at 35% 55%,#bfd0e1 60%,transparent);animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
.moon{position:absolute;right:12%;top:9%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#dfe8f0 60%,#bfd0e1);box-shadow:0 0 40px 12px rgba(223,232,240,.18)}
.horizon{position:absolute;left:0;right:0;top:42%;height:1px;background:linear-gradient(90deg,transparent,rgba(191,208,225,.5),transparent)}
.lighthouse{position:absolute;left:4%;bottom:52%;width:70px;height:170px}
.lighthouse svg{width:100%;height:100%;display:block}
.beam{position:absolute;left:4%;bottom:52%;width:70px;height:170px;pointer-events:none}
.beam i{position:absolute;left:35px;top:16px;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;background:conic-gradient(from -8deg,transparent 0deg,rgba(252,209,162,.0) 0deg,rgba(252,209,162,.38) 8deg,rgba(247,140,22,.16) 14deg,transparent 22deg);animation:sweep 11s linear infinite;mix-blend-mode:screen;transform-origin:center}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.lamp{position:absolute;left:4%;bottom:52%;width:70px;height:170px;pointer-events:none}
.lamp i{position:absolute;left:28px;top:9px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 18px 8px rgba(252,209,162,.9),0 0 60px 24px rgba(247,140,22,.45);animation:lamp 11s linear infinite}
@keyframes lamp{0%,100%{opacity:.6}50%{opacity:1}}
.waves{position:absolute;left:0;right:0;height:140px;background-repeat:repeat-x;background-size:900px 140px}
.w1{top:42%;margin-top:-6px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 140' preserveAspectRatio='none'><path d='M0 40 C150 10 300 70 450 40 C600 10 750 70 900 40 L900 140 L0 140 Z' fill='%230b3a5e' opacity='.9'/></svg>");animation:wave 14s linear infinite;opacity:.95}
.w2{top:46%;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 140' preserveAspectRatio='none'><path d='M0 50 C120 20 260 85 450 50 C640 15 780 85 900 50 L900 140 L0 140 Z' fill='%23002B49' opacity='.95'/></svg>");animation:wave 9s linear infinite reverse}
.w3{top:52%;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 140' preserveAspectRatio='none'><path d='M0 60 C200 30 300 90 450 60 C600 30 700 90 900 60 L900 140 L0 140 Z' fill='%23041a2d'/><path d='M0 60 C200 30 300 90 450 60 C600 30 700 90 900 60' fill='none' stroke='%23bfd0e1' stroke-opacity='.35' stroke-width='1.5'/></svg>");animation:wave 7s linear infinite}
.w4{top:56%;height:60vh;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 140' preserveAspectRatio='none'><path d='M0 30 C150 10 300 50 450 30 C600 10 750 50 900 30 L900 140 L0 140 Z' fill='%23031322'/></svg>");background-size:900px 100%;animation:wave 20s linear infinite reverse}
@keyframes wave{from{background-position-x:0}to{background-position-x:900px}}
.ship{position:absolute;top:40.5%;left:38%;width:150px;height:70px;transform-origin:50% 100%;animation:bob 5s ease-in-out infinite;transition:left 1.2s ease}
.ship svg{width:100%;height:100%;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(5px) rotate(1.5deg)}}
.fin{position:absolute;top:49%;left:-80px;width:64px;height:34px;opacity:0;animation:fin 38s linear infinite 9s}
.fin svg{width:100%;height:100%;display:block}
@keyframes fin{0%{left:-80px;opacity:0}2%{opacity:.9}12%{left:30%;transform:translateY(0)}14%{transform:translateY(5px)}18%{left:45%;opacity:.9}22%{opacity:0;left:55%}100%{left:55%;opacity:0}}
.bubbles{position:absolute;inset:60% 0 0 0;pointer-events:none}
.bubbles i{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;border:1px solid rgba(191,208,225,.5);background:rgba(191,208,225,.08);animation:rise 12s linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(-70vh) translateX(18px);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}30%{opacity:.15}45%{opacity:.6}100%{opacity:0}}
.sea.storm .w1,.sea.storm .w2,.sea.storm .w3{animation-duration:3.5s}
.sea.storm .ship{animation-duration:2.2s}
.sea.deep{background:linear-gradient(180deg,#041322 0%,#031322 40%,#020b14 100%)}
/* ---------- cortina de onda entre telas ---------- */
.wipe{position:fixed;left:0;right:0;top:100%;height:120vh;z-index:40;pointer-events:none;background:#031322 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 140' preserveAspectRatio='none'><path d='M0 60 C150 20 300 100 450 60 C600 20 750 100 900 60 L900 140 L0 140 Z' fill='%23031322'/></svg>") repeat-x top/900px 140px;background-color:transparent}
.wipe:after{content:"";position:absolute;inset:140px 0 0 0;background:#031322}
.wipe.on{animation:wipe .72s cubic-bezier(.65,0,.35,1)}
@keyframes wipe{0%{top:100%}45%{top:-12vh}55%{top:-12vh}100%{top:-140vh}}
/* ---------- barra de rota (progresso) ---------- */
.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:10px 16px;background:rgba(2,11,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid rgba(191,208,225,.14)}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--light-blue);white-space:nowrap}
.brand b{color:#fff}
.route{position:relative;height:26px}
.route .line{position:absolute;left:14px;right:14px;top:13px;border-top:2px dotted rgba(191,208,225,.45)}
.route .done{position:absolute;left:14px;top:13px;border-top:2px solid var(--orange);width:0;transition:width .6s ease}
.route .port,.route .far{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--light-blue);background:#031322}
.route .port{left:6px} .route .far{right:6px;border-color:var(--orange);box-shadow:0 0 10px 2px rgba(247,140,22,.6)}
.route .boat{position:absolute;top:-2px;left:14px;width:30px;height:30px;margin-left:-15px;transition:left .6s ease}
.route .boat svg{width:100%;height:100%;display:block}
.gauge{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--peach);letter-spacing:.06em;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.gauge.over{color:var(--orange)}
@media (max-width:560px){.brand .long{display:none} .top{gap:10px;padding:9px 12px}}
@media (min-width:561px){.brand .short{display:none}}
/* ---------- palco ---------- */
main{position:relative;z-index:1;min-height:calc(100dvh - 48px);display:flex;flex-direction:column}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:22px 16px 36px;flex:1;display:flex;flex-direction:column;gap:16px}
.screen{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--light-blue)}
.eyebrow b{color:var(--peach)}
h1{font-family:var(--serif);font-weight:700;line-height:1.02;font-size:clamp(44px,9vw,76px);color:#fff}
h1 em{font-style:normal;color:var(--peach)}
h2{font-family:var(--serif);font-weight:700;line-height:1.12;font-size:clamp(25px,5.4vw,34px)}
.lede{font-size:18px;line-height:1.5;color:var(--ice);max-width:58ch}
.hand{font-family:var(--hand);font-size:18px;line-height:1.3;color:var(--peach)}
.small{font-size:14px;color:var(--light-blue)}
/* ---------- papel de carta náutica ---------- */
.paper{position:relative;background:var(--paper);color:var(--ink);border-radius:4px;padding:22px 22px 20px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.25) inset;background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:28px 28px;display:flex;flex-direction:column;gap:14px}
.paper:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(154,110,50,.14));pointer-events:none;border-radius:4px}
.paper>*{position:relative}
.paper h2{color:var(--navy)}
.paper .eyebrow{color:var(--ink-2)} .paper .eyebrow b{color:var(--orange-d)}
.paper .small{color:var(--ink-2)}
.paper .hand{color:var(--rust)}
.tag{position:absolute;top:-14px;left:18px;background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.tag:after{content:"";position:absolute;left:0;bottom:-6px;border:6px solid transparent;border-top-color:#001a2d;border-left-color:#001a2d;width:0}
.rose{position:absolute;right:14px;top:10px;width:74px;height:74px;opacity:.35}
.dts{font-size:14px;color:var(--ink-2);border-left:3px solid var(--orange);padding-left:10px;font-family:var(--hand);font-size:16px}
/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.02em;padding:14px 24px;border-radius:999px;background:var(--orange);color:var(--navy);min-height:50px;box-shadow:0 8px 22px rgba(247,140,22,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(247,140,22,.45)}
.btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.btn.sec{background:transparent;color:inherit;border:1.5px solid currentColor;box-shadow:none}
.btn.txt{background:transparent;color:inherit;box-shadow:none;text-decoration:underline;padding-inline:8px;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:14px;border-top:1px dashed var(--paper-line)}
.screen>.nav{border-top-color:rgba(191,208,225,.25)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--light-blue)}
.paper .field label{color:var(--ink-2)}
.field input,.field textarea{font:inherit;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(191,208,225,.45);border-radius:6px;padding:13px 14px;width:100%}
.paper .field input,.paper .field textarea{color:var(--ink);background:rgba(255,255,255,.55);border-color:var(--steel)}
.field input::placeholder,.field textarea::placeholder{color:rgba(191,208,225,.6)} .paper .field textarea::placeholder{color:#8a97a8}
.rules{display:grid;gap:10px;list-style:none}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;font-size:16px;color:var(--ice)}
.rules li i{font-style:normal;width:26px;height:26px;border:1.5px solid var(--peach);border-radius:50%;text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;line-height:23px;color:var(--peach)}
.meta{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--light-blue)}
.meta b{color:#fff;font-family:var(--serif);font-size:32px;letter-spacing:0;display:block;line-height:1}
/* ---------- opções ---------- */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;border:1.5px solid var(--steel);border-radius:8px;padding:14px 16px;background:var(--paper);transition:transform .15s,background .15s,border-color .15s}
.paper .opt{background:rgba(255,255,255,.5)}
.opt:hover{background:#fff;transform:translateX(3px)}
.opt i{font-style:normal;width:34px;height:34px;border:1.5px solid var(--navy);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--navy);background:#fff}
.opt b{display:block;font-family:var(--serif);font-size:18px;line-height:1.25;color:var(--navy)}
.opt span{display:block;font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.35}
.opt.on{border-color:var(--orange);background:#fff;box-shadow:0 10px 24px rgba(0,43,73,.14)}
.opt.on i{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.opt.dim{opacity:.45}
/* ---------- reflexo (mar aberto) ---------- */
.rx{display:flex;flex-direction:column;gap:18px;flex:1}
.rx-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.helm{position:relative;width:64px;height:64px;flex:none}
.helm svg{width:64px;height:64px;display:block}
.helm .wheel{transform-origin:32px 32px;animation:helm 6s linear}
@keyframes helm{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.helm circle.fg{fill:none;stroke:var(--orange);stroke-width:4;transform:rotate(-90deg);transform-origin:32px 32px;transition:stroke-dashoffset .1s linear}
.helm b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.helm.out circle.fg{stroke:var(--steel)}
.rx-q{font-family:var(--serif);font-weight:700;font-size:clamp(28px,6.6vw,42px);line-height:1.1;color:#fff;min-height:2.2em;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.rx-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;perspective:900px}
.flag{position:relative;min-height:190px;padding:26px 16px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;font-family:var(--serif);font-size:20px;line-height:1.2;color:var(--navy);background:var(--paper);border-radius:6px;box-shadow:0 16px 34px rgba(0,0,0,.45);transition:transform .25s,opacity .25s;transform-origin:50% 0}
.flag:before{content:"";position:absolute;left:14px;right:14px;top:10px;height:3px;background:repeating-linear-gradient(90deg,var(--navy) 0 10px,transparent 10px 16px);opacity:.6}
.flag small{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.flag.l{animation:sway 4s ease-in-out infinite} .flag.r{animation:sway 4s ease-in-out infinite reverse}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.flag:hover{transform:translateY(-4px) scale(1.02)}
.flag.pick{animation:none;transform:translateY(-10px) scale(1.04);box-shadow:0 0 0 4px var(--orange),0 24px 40px rgba(0,0,0,.5)}
.flag.fade{animation:sink .5s ease-in forwards}
@keyframes sink{to{transform:translateY(60px) rotate(8deg);opacity:0}}
.rx-cards.tilt-l .flag.l{transform:scale(1.04) rotate(-3deg)} .rx-cards.tilt-r .flag.r{transform:scale(1.04) rotate(3deg)}
.rx-cards.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.rx-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--light-blue)}
.rx-msg{min-height:1.4em;font-family:var(--hand);font-size:18px;color:var(--peach)}
.rx .dts{color:var(--light-blue);border-color:var(--orange)}
/* ---------- porão (mesa de fichas) ---------- */
.mesa{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1.5px solid var(--steel);border-radius:8px;padding:10px 12px;background:rgba(255,255,255,.45)}
.mrow .lbl{font-family:var(--serif);font-size:17px;line-height:1.2;color:var(--navy)}
.mrow .lbl span{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-top:2px}
.mrow .ctl{display:flex;align-items:center;gap:6px}
.mrow .ctl button{width:42px;height:42px;border:1.5px solid var(--navy);border-radius:50%;font-size:24px;font-weight:700;display:grid;place-items:center;background:#fff;color:var(--navy)}
.mrow .ctl button:hover{background:var(--navy);color:#fff}
.mrow .ctl button[disabled]{opacity:.3}
.mrow .ctl b{min-width:44px;text-align:center;font-family:var(--serif);font-size:28px;color:var(--navy);font-variant-numeric:tabular-nums}
.crates{grid-column:1/-1;display:flex;gap:4px;min-height:14px}
.crates i{width:9%;height:14px;background:var(--orange);border-radius:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.left{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-2)}
.left b{font-family:var(--serif);font-size:34px;color:var(--navy)}
.left b.zero{color:var(--orange-d)}
/* ---------- rádio de bordo ---------- */
.calls{display:grid;gap:8px}
.call{display:grid;grid-template-columns:46px 1fr;gap:12px;border:1.5px solid var(--steel);border-radius:8px;padding:10px 12px;align-items:start;background:rgba(255,255,255,.45);transition:background .15s}
.call .av{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.04em;text-align:center;line-height:1.1;padding:2px;position:relative}
.call .av:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--steel);opacity:.5;animation:ping 2.4s ease-out infinite}
.call.on .av:after,.call.postal .av:after{animation:none;opacity:0}

  const coreN = at.filter(c => c.core).length, negN = at.filter(c => c.neg).length;

const Sync = (() => {

  const fp = t => { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36) + '.' + t.length; };

})();

function contratoTxt(v) { return v <= 10 ? 'Fixo, sem risco' : v < 45 ? `${100 - v}% para o fixo` : v <= 55 ? 'Meio a meio' : v < 90 ? `${v}% para o resultado` : 'Tudo no resultado'; }

/* bússola em SVG: agulhas = [{ang, len, label, cls}] · opt.light = painel claro · opt.animate = agulha gira e assenta */
function compassSvg(needles, opt = {}) {
  const W = 400, c = 200, R = 150;
  const dark = !opt.light;
  const ticks = []; for (let a = 0; a < 360; a += 5) { const r1 = a % 90 === 0 ? R - 18 : a % 30 === 0 ? R - 12 : a % 10 === 0 ? R - 8 : R - 4; const rad = a * Math.PI / 180; ticks.push(`<line x1="${c + Math.sin(rad) * r1}" y1="${c - Math.cos(rad) * r1}" x2="${c + Math.sin(rad) * R}" y2="${c - Math.cos(rad) * R}" stroke="${dark ? '#FCD1A2' : '#33556d'}" stroke-width="${a % 90 === 0 ? 2.5 : a % 30 === 0 ? 1.5 : .8}" opacity="${a % 10 === 0 ? 1 : .5}"/>`); }
  const lab = (t, x, y, anchor = 'middle', big = false) => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="Courier Prime, monospace" font-size="${big ? 12 : 11}" font-weight="700" letter-spacing=".12em" fill="${dark ? '#DFE8F0' : '#33556d'}">${t}</text>`;
  const needle = n => { const L = R * (n.len || .9); const rad = n.ang * Math.PI / 180; const tx = c + Math.sin(rad) * L, ty = c - Math.cos(rad) * L;
    const col = n.cls === 'plan' ? '#f78c16' : n.cls === 'team' ? (dark ? '#ffffff' : '#002b49') : (dark ? '#7ea1c3' : '#5e8ab4'); const w = n.cls === 'plan' ? 4 : n.cls === 'team' ? 3 : 1.5;
    const line = `<line x1="${c}" y1="${c}" x2="${tx}" y2="${ty}" stroke="${col}" stroke-width="${w}" ${n.cls === 'team' ? 'stroke-dasharray="6 4"' : ''}/>`;
    const lr = n.cls === 'plan' ? R + 16 : n.cls === 'team' ? L * .55 : L + 11;
    const lbl = n.label ? `<text x="${c + Math.sin(rad) * lr}" y="${c - Math.cos(rad) * lr + 4}" text-anchor="middle" font-family="Courier Prime, monospace" font-size="${n.cls === 'plan' || n.cls === 'team' ? 11 : 10}" font-weight="700" fill="${col}">${esc(n.label)}</text>` : '';
    return line + lbl; };
  const me = needles.filter(n => !n.cls); const others = needles.filter(n => n.cls);
  const meNeedle = me.map(n => { const L = R * n.len; return `<g class="needle-anim" style="transform:rotate(${opt.animate ? -540 : n.ang}deg)" data-ang="${n.ang}"><polygon points="${c},${c - L} ${c - 11},${c} ${c + 11},${c}" fill="#f78c16"/><polygon points="${c},${c + L * .55} ${c - 11},${c} ${c + 11},${c}" fill="${dark ? '#DFE8F0' : '#99aab6'}"/></g>`; }).join('');
  return `<svg class="compass" viewBox="0 0 ${W} ${W}" role="img" aria-label="Bússola">
    <defs><radialGradient id="brass" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="${dark ? '#0b3a5e' : '#ffffff'}"/><stop offset="1" stop-color="${dark ? '#031322' : '#F3ECDC'}"/></radialGradient><radialGradient id="rim" cx="50%" cy="50%" r="50%"><stop offset=".92" stop-color="#F9A345"/><stop offset="1" stop-color="#D9700A"/></radialGradient></defs>
    <circle cx="${c}" cy="${c}" r="${R + 22}" fill="url(#rim)" opacity="${dark ? 1 : .9}"/>
    <circle cx="${c}" cy="${c}" r="${R + 10}" fill="${dark ? '#031322' : '#F3ECDC'}"/>
    <circle cx="${c}" cy="${c}" r="${R}" fill="url(#brass)" stroke="${dark ? '#FCD1A2' : '#002b49'}" stroke-width="1.5"/>
    <circle cx="${c}" cy="${c}" r="${R - 42}" fill="none" stroke="${dark ? '#5E8AB4' : '#cdd5db'}" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="${c - R + 24}" y1="${c}" x2="${c + R - 24}" y2="${c}" stroke="${dark ? '#33556D' : '#cdd5db'}" stroke-width="1"/>
    <line x1="${c}" y1="${c - R + 24}" x2="${c}" y2="${c + R - 24}" stroke="${dark ? '#33556D' : '#cdd5db'}" stroke-width="1"/>
    ${ticks.join('')}
    ${lab('NÚCLEO FORTE', c, c - R + 44, 'middle', true)}${lab('ABRIR FRENTES', c, c + R - 34, 'middle', true)}
    ${lab('CFO', c - R + 28, c - 6, 'start')}${lab('NA CRISE', c - R + 28, c + 8, 'start')}
    ${lab('CIO', c + R - 28, c - 6, 'end')}${lab('PARA NÃO FALHAR', c + R - 28, c + 8, 'end')}
    ${others.filter(n => n.cls !== 'plan' && n.cls !== 'team').map(needle).join('')}
    ${others.filter(n => n.cls === 'team').map(needle).join('')}
    ${others.filter(n => n.cls === 'plan').map(needle).join('')}
    ${meNeedle}
    <circle cx="${c}" cy="${c}" r="8" fill="${dark ? '#F3ECDC' : '#002b49'}" stroke="#f78c16" stroke-width="3"/>
  </svg>`;
}

const AFTER = {
  capa() { },
  rx() { startReflex(false); },
  rx_treino() { startReflex(true); },
  final() {
    const g = document.querySelector('.needle-anim'); if (g) requestAnimationFrame(() => setTimeout(() => { g.style.transform = `rotate(${g.dataset.ang}deg)`; }, 150));
    const el = document.getElementById('sync');
    const paint = st => { if (!el) return; if (!st.enabled) { el.innerHTML = '<span class="dot"></span>Respostas guardadas neste navegador (sem planilha configurada).'; return; }
      el.innerHTML = st.pending ? `<span class="dot ${st.lastErr ? 'err' : 'wait'}"></span>${st.lastErr ? 'Tentando enviar à facilitação: ' + esc(st.lastErr) : 'Enviando à facilitação…'}` : '<span class="dot ok"></span>Enviado à facilitação.'; };
    Sync.on(paint); paint(Sync.status());
  }
};
function startReflex(treino) {
  rxLocked = false; rxStart = performance.now();
  const fg = document.querySelector('.helm .fg'), num = document.getElementById('tnum'), circ = 2 * Math.PI * 27;
  const tick = () => { const el = performance.now() - rxStart; const left = Math.max(0, REFLEX_MS - el); fg.style.strokeDashoffset = circ * (1 - left / REFLEX_MS); num.textContent = Math.ceil(left / 1000);
    if (left <= 0) { timeoutReflex(treino); return; } rxTimer = requestAnimationFrame(tick); };
  rxTimer = requestAnimationFrame(tick);
  const cards = document.getElementById('rxc'); let x0 = null;
  cards.addEventListener('pointerdown', e => { x0 = e.clientX; });
  cards.addEventListener('pointermove', e => { if (x0 == null) return; const dx = e.clientX - x0; cards.classList.toggle('tilt-l', dx < -30); cards.classList.toggle('tilt-r', dx > 30); });
  const end = e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; cards.classList.remove('tilt-l', 'tilt-r'); if (Math.abs(dx) > 60) answerReflex(dx < 0 ? 'L' : 'R', treino); };
  cards.addEventListener('pointerup', end); cards.addEventListener('pointercancel', () => { x0 = null; cards.classList.remove('tilt-l', 'tilt-r'); });
}
function answerReflex(side, treino) {
  if (rxLocked) return; rxLocked = true;
  const ms = Math.round(performance.now() - rxStart);
  if (rxTimer) { cancelAnimationFrame(rxTimer); rxTimer = null; }
  const r = STEPS[S.step].rx;
  if (treino) S.a.treino = { side, ms }; else S.a.rx[r.id] = { side, ms, hesitou: false };
  save();
  document.querySelectorAll('.flag').forEach(b => b.classList.add(b.dataset.side === side ? 'pick' : 'fade'));
  const msg = document.getElementById('rxmsg'); msg.textContent = treino ? `Isso. ${fmt1(ms / 1000)} s. Agora vale.` : `${fmt1(ms / 1000)} s`;
  setTimeout(() => go(S.step + 1, false), treino ? 1000 : 520);
}
function timeoutReflex(treino) {
  if (rxLocked) return; rxLocked = true; rxTimer = null;
  const r = STEPS[S.step].rx; const tm = document.getElementById('timer'), rxc = document.getElementById('rxc'); if (!r || !tm || !rxc) return; tm.classList.add('out'); rxc.classList.add('shake');
  const f = document.getElementById('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  if (treino) S.a.treino = { side: null, ms: null }; else S.a.rx[r.id] = { side: null, ms: null, hesitou: true };
  save();
  document.getElementById('rxmsg').textContent = treino ? 'O timão zerou: nas próximas, isso conta como hesitação.' : 'Relâmpago: sem resposta, contamos como hesitação.';
  setTimeout(() => go(S.step + 1, false), treino ? 1500 : 1100);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a;
  switch (a) {
    case 'start': {
      const nome = document.getElementById('nome').value.trim(); if (!nome) { document.getElementById('nome').focus(); document.getElementById('nome').placeholder = 'Precisamos do seu nome para o mostrador do time'; return; }
      S.nome = nome; S.email = (document.getElementById('email').value || '').trim();
      if (!S.startedAt) S.startedAt = new Date().toISOString();
      save(); go(S.step > 0 ? S.step : 1); break; }
    case 'next': next(); break;
    case 'back': if (STEPS[S.step].rx || stepId() === 'rx_treino') return; back(); break;
    case 'reset': if (confirm('Apagar as respostas e começar de novo?')) { S = fresh(); save(); render(); } break;
    case 'painel': location.search = '?painel'; break;
    case 'rx': answerReflex(el.dataset.side, stepId() === 'rx_treino'); break;

      </div>
      ${frases ? `<div class="pn-block"><h2>“Em 2027, o cliente liga para o DTS quando…”</h2><div class="frases">${frases}</div></div>` : ''}
      <p class="foot">Como ler: cada dimensão vai de 0 a 100; a posição do planejamento FY27 vem do material de planejamento (proposta DTS, a validar com os sócios). A aderência é a distância média ponderada entre as respostas e essa posição; serve para abrir a conversa, não para dar nota. Reflexo: mediana do tempo de resposta nas oito decisões de 6 segundos. Coerência: quanto o instinto (reflexos) e a reflexão (rota, espelho, pergunta de IA) apontam para o mesmo lado.</p>
    </div>`;
    el.querySelector('[data-p="live"]').onclick = async () => { const m = document.getElementById('srcmsg'); m.textContent = 'Lendo a planilha…'; try { setRows(await fetchLive(), 'planilha (ao vivo, atualiza a cada 30 s)'); clearInterval(liveTimer); liveTimer = setInterval(async () => { try { const rs = await fetchLive(); if (rs.length !== rows.length) setRows(rs, 'planilha (ao vivo, atualiza a cada 30 s)'); } catch (e) { } }, 30000); } catch (e) { m.textContent = 'Não deu para ler a planilha: ' + e.message; } };
    el.querySelector('[data-p="local"]').onclick = () => { const rs = []; try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.finishedAt) { const keep = S; S = d; rs.push(buildRow()); S = keep; } } catch (e) { } setRows(rs, 'este navegador'); if (!rs.length) document.getElementById('srcmsg').textContent = 'Nenhuma resposta concluída neste navegador.'; };
    el.querySelector('[data-p="demo"]').onclick = () => setRows(demo(), 'dados de exemplo (fictícios)');
    el.querySelector('[data-p="print"]').onclick = () => window.print();
    el.querySelector('[data-p="copy"]').onclick = () => { const txt = resumoTexto(rows, gaps, pautas, mean); navigator.clipboard.writeText(txt).then(() => document.getElementById('srcmsg').textContent = 'Resumo copiado.'); };
    el.querySelector('[data-p="paste"]').onclick = () => { const t = document.getElementById('paste').value.trim(); if (!t) return; try { let rs; if (t[0] === '[' || t[0] === '{') { const j = JSON.parse(t); rs = Array.isArray(j) ? j : j.linhas || []; } else rs = parseCsv(t); setRows(rs, 'colado'); document.getElementById('srcmsg').textContent = rs.length + ' linha(s) lidas.'; } catch (e) { document.getElementById('srcmsg').textContent = 'Não entendi o conteúdo colado: ' + e.message; } };
  }
  function heroTexto(rows, mean, teamAng, ph) {
    const n = rows.length; if (!n) return '<p class="lede">Quando as respostas chegarem, aqui aparece a leitura do time: para onde aponta, o quanto está junto e a distância para o planejamento.</p>';
    const diff = Math.abs(((teamAng - ph.ang) + 540) % 360 - 180);
    const px = mean('PORTA'), py = mean('FOCO');
    const lado = px < 42 ? 'para o CFO, na crise' : px > 58 ? 'para o CIO, na prevenção' : 'para o caminho do meio';
    const foco = py > 60 ? 'com foco no núcleo' : py < 40 ? 'abrindo frentes' : 'entre foco e amplitude';
    const cnt = {}; rows.forEach(r => cnt[r.arquetipo] = (cnt[r.arquetipo] || 0) + 1);
    const arqs = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
    const sdP = Math.sqrt(avg(rows.map(r => (r.PORTA - px) ** 2))), juntos = sdP < 15 ? 'bem alinhado' : sdP < 25 ? 'parcialmente alinhado' : 'dividido';
    return `<div class="big2">O time aponta <b>${lado}</b>, ${foco}.</div>
      <p class="lede" style="font-size:17px">${diff < 25 ? 'Direção parecida com a do planejamento' : diff < 60 ? 'Direção próxima, com desvio em relação ao planejamento' : 'Direção diferente da do planejamento'} (${Math.round(diff)}° de diferença). No dilema CFO × CIO o time está <b>${juntos}</b>.</p>
      <div class="arqs">${arqs.map(([a, c]) => `<div><b>${c}</b><div>${esc(a)}<span>${esc((Object.values(ARQUETIPOS).find(x => x.nome === a) || {}).txt || '')}</span></div></div>`).join('')}</div>`;
  }
  function resumoTexto(rows, gaps, pautas, mean) {
    const n = rows.length; const L = [`Bússola DTS 2027 · resumo (${n} respostas)`, ''];
    Object.keys(DIMS).forEach(k => L.push(`${DIMS[k].nome}: time ${n ? Math.round(mean(k)) : '—'} · plano ${DIMS[k].plan}`));
    L.push('', 'Mesa de investimento (time × plano): ' + MESAS.map((m, i) => `${m.nome} ${n ? Math.round(mean('mesaP' + (i + 1))) : '—'}/${PLAN_MESA[i]}`).join(' · '));
    L.push('', 'Pautas sugeridas:'); pautas.forEach((p, i) => L.push(`${i + 1}. ${p.t} ${p.s}`));
    L.push('', 'Por pessoa:'); rows.forEach(r => L.push(`- ${r.nome}: ${r.arquetipo} · aderência ${r.aderencia} · reflexo ${r.velocidadeMed == null ? '—' : fmt1(r.velocidadeMed) + 's'} · hesitações ${r.hesitacoes} · coerência ${r.coerencia}%`));
    return L.join('\n');
  }
  draw();
}
