<!doctype html>
<html lang="pt-BR" data-theme="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bússola DTS 2027</title>
<meta name="description" content="Diagnóstico rápido para o planejamento FY27 do DTS (Alvarez & Marsal): sete minutos, dezoito decisões, uma bússola.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap">
<!-- =====================================================================
     BASE DE RESPOSTAS · GOOGLE PLANILHAS
     1. Crie uma planilha nova e cole o Apps Script de google-apps-script/Codigo.gs
        (passo a passo em google-apps-script/LEIAME.md).
     2. Implante como "App da Web" e cole abaixo o link que termina em /exec.
     Sem link, a bússola funciona igual e guarda as respostas só neste navegador.
     ===================================================================== -->
<script id="dts-config">
  window.BUSSOLA_CONFIG = {
    sheetsEndpoint: '',       // link do Apps Script (termina em /exec)
    painelToken: '',          // o mesmo TOKEN definido no Codigo.gs (o painel usa para ler as respostas ao vivo)
    mostrarAderencia: false   // true = o participante vê a aderência ao plano no final (recomendado: false)
  };
</script>
<style>
/* =====================================================================
   BÚSSOLA DTS 2027 · design system A&M (tema navy)
   Navy carrega, cinza estrutura, azul apoia, laranja só aponta.
   Cantos retos, fios de 1px, sem sombra, sem gradiente.
   ===================================================================== */
:root{
  --navy-100:#002b49; --navy-80:#33556d; --navy-40:#99aab6; --navy-20:#ccd5db;
  --orange-100:#f78c16; --orange-80:#f9a345; --orange-40:#fcd1a2; --orange-20:#fde8d0;
  --gray-100:#cdd5db; --gray-80:#d7dde2; --gray-40:#ebeef1; --gray-20:#f5f7f8;
  --blue-100:#5e8ab4; --blue-80:#7ea1c3; --blue-40:#bfd0e1; --blue-20:#dfe8f0;
  --positive:#9acc3c; --attention:#f9c20a; --negative:#cf3d3d; --white:#fff;
  --surface:#002b49; --surface-subtle:#33556d; --ink:#fff; --ink-muted:#ccd5db;
  --line:#33556d; --line-strong:#ccd5db; --accent:#f78c16; --action:#fff; --action-ink:#002b49;
  --font-light:"Arial Nova Light","Arial Nova",Arial,"Helvetica Neue",sans-serif;
  --font-cond:"Arial Nova Cond","Arial Nova Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--surface);color:var(--ink);font-family:var(--font-cond);font-size:17px;line-height:1.4;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange-80);outline-offset:2px}
.sr{position:absolute;left:-9999px}
/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:5}
.brand{font-family:var(--font-cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.brand .long{display:inline} .brand .short{display:none}
@media (max-width:560px){.brand .long{display:none} .brand .short{display:inline} .brand{font-size:11px} .ring{gap:2px} .ring i{width:4px;height:9px} .top{gap:8px;padding:10px 12px}}
.brand b{color:var(--ink)}
.ring{display:flex;gap:3px;align-items:center}
.ring i{display:block;width:6px;height:10px;background:var(--navy-80)}
.ring i.on{background:var(--navy-20)}
.ring i.cur{background:var(--accent)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ink-muted);min-width:46px;text-align:right}
.clock.over{color:var(--orange-80)}
/* ---------- palco ---------- */
main{flex:1;display:flex;flex-direction:column}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:20px 16px 28px;flex:1;display:flex;flex-direction:column;gap:var(--s4)}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.eyebrow b{color:var(--orange-80)}
h1,h2{font-family:var(--font-light);font-weight:300;line-height:1.15}
h1{font-size:clamp(38px,8vw,58px)}
h2{font-size:clamp(24px,5.2vw,32px)}
.rule{width:48px;height:4px;background:var(--accent);margin:4px 0}
.lede{font-size:19px;line-height:1.4;color:var(--ink-muted);max-width:56ch}
.small{font-size:14px;color:var(--ink-muted)}
.dts{font-size:14px;color:var(--navy-40);border-left:1px solid var(--line);padding-left:10px}
/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.02em;padding:14px 24px;border:1px solid var(--action);background:var(--action);color:var(--action-ink);border-radius:2px;min-height:48px}
.btn:hover{background:var(--navy-20);border-color:var(--navy-20)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.sec:hover{background:var(--surface-subtle)}
.btn.txt{background:transparent;border-color:transparent;color:var(--blue-40);text-decoration:underline;padding-inline:8px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:var(--s4);border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.field input,.field textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:2px;padding:12px 14px;width:100%}
.field input::placeholder,.field textarea::placeholder{color:var(--navy-40)}
.rules{display:grid;gap:8px;list-style:none}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:16px;color:var(--ink-muted)}
.rules li i{font-style:normal;display:block;width:22px;height:22px;border:1px solid var(--line-strong);text-align:center;font-size:12px;font-weight:700;line-height:20px;color:var(--ink)}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink-muted)}
.meta b{color:var(--ink);font-family:var(--font-light);font-weight:300;font-size:26px;display:block;line-height:1}
/* ---------- opções (cartões) ---------- */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;border:1px solid var(--line-strong);padding:14px 16px;border-radius:2px;background:transparent;transition:background .15s}
.opt:hover{background:var(--surface-subtle)}
.opt i{font-style:normal;width:30px;height:30px;border:1px solid var(--line-strong);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt b{display:block;font-size:17px;line-height:1.3}
.opt span{display:block;font-size:14px;color:var(--ink-muted);margin-top:4px;line-height:1.35}
.opt.on{border-color:var(--orange-80);background:var(--surface-subtle)}
.opt.on i{background:var(--accent);border-color:var(--accent);color:var(--navy-100)}
.opt.dim{opacity:.45}
/* ---------- reflexo ---------- */
.rx-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{width:54px;height:54px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:4}
.timer .bg{stroke:var(--navy-80)}
.timer .fg{stroke:var(--accent);stroke-linecap:butt;transition:stroke-dashoffset .1s linear}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}
.timer.out .fg{stroke:var(--navy-40)}
.rx-q{font-family:var(--font-light);font-weight:300;font-size:clamp(26px,6vw,36px);line-height:1.15;min-height:2.2em}
.rx-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.rx-opt{border:1px solid var(--line-strong);padding:22px 14px;min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;font-size:19px;line-height:1.25;border-radius:2px;transition:transform .18s,background .15s,border-color .15s}
.rx-opt small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
.rx-opt:hover{background:var(--surface-subtle)}
.rx-opt.pick{border-color:var(--accent);background:var(--surface-subtle)}
.rx-opt.fade{opacity:.35}
.rx-cards.tilt-l .rx-opt.l{transform:scale(1.03)} .rx-cards.tilt-r .rx-opt.r{transform:scale(1.03)}
.rx-cards.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rx-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink-muted)}
.rx-msg{min-height:1.4em;font-size:14px;color:var(--orange-80)}
/* ---------- mesa de fichas ---------- */
.mesa{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px 12px}
.mrow .lbl{font-size:16px;line-height:1.25}
.mrow .lbl span{display:block;font-size:13px;color:var(--ink-muted)}
.mrow .ctl{display:flex;align-items:center;gap:6px}
.mrow .ctl button{width:40px;height:40px;border:1px solid var(--line-strong);font-size:22px;font-weight:700;display:grid;place-items:center;border-radius:2px}
.mrow .ctl button:hover{background:var(--surface-subtle)}
.mrow .ctl button[disabled]{opacity:.3}
.mrow .ctl b{min-width:40px;text-align:center;font-family:var(--font-light);font-weight:300;font-size:26px;font-variant-numeric:tabular-nums}
.mrow .bar{grid-column:1/-1;height:6px;background:var(--navy-80)}
.mrow .bar i{display:block;height:100%;background:var(--blue-80);transition:width .2s}
.left{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-muted)}
.left b{font-family:var(--font-light);font-weight:300;font-size:30px;color:var(--ink)}
.left b.zero{color:var(--orange-80)}
/* ---------- telefone ---------- */
.calls{display:grid;gap:8px}
.call{display:grid;grid-template-columns:44px 1fr;gap:10px;border:1px solid var(--line);padding:10px 12px;align-items:start}
.call .av{width:44px;height:44px;border:1px solid var(--line-strong);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.04em;text-align:center;line-height:1.1;padding:2px}
.call .who{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.call .txt{font-size:16px;line-height:1.3;margin:2px 0 8px}
.call .acts{display:flex;gap:8px;flex-wrap:wrap}
.call .acts button{border:1px solid var(--line-strong);padding:7px 12px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:2px;display:inline-flex;gap:6px;align-items:center}
.call .acts button:hover{background:var(--surface-subtle)}
.call .acts button.on{background:var(--white);color:var(--navy-100);border-color:var(--white)}
.call .acts button.on.postal{background:var(--navy-80);color:var(--white);border-color:var(--navy-40)}
.call .acts button i{font-style:normal;width:18px;height:18px;background:var(--accent);color:var(--navy-100);display:grid;place-items:center;font-size:11px}
.call.on{border-color:var(--navy-20)}
.call.postal{opacity:.55}
.callstat{display:flex;gap:18px;font-size:14px;color:var(--ink-muted)}
.callstat b{color:var(--ink)}
/* ---------- slider ---------- */
.slide{display:grid;gap:10px}
.slide input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent}
.slide input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--navy-80)}
.slide input[type=range]::-moz-range-track{height:6px;background:var(--navy-80)}
.slide input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;background:var(--white);border:4px solid var(--accent);margin-top:-14px;border-radius:50%;cursor:grab}
.slide input[type=range]::-moz-range-thumb{width:26px;height:26px;background:var(--white);border:4px solid var(--accent);border-radius:50%;cursor:grab}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:14px;color:var(--ink-muted)}
.ends div:last-child{text-align:right}
.ends b{display:block;color:var(--ink);font-size:16px}
.big{font-family:var(--font-light);font-weight:300;font-size:clamp(44px,12vw,72px);line-height:1;text-align:center}
.big small{display:block;font-family:var(--font-cond);font-size:16px;color:var(--ink-muted);margin-top:6px}
/* ---------- ordem ---------- */
.ord .opt i{background:transparent}
.ord .opt.on i{background:var(--accent);border-color:var(--accent);color:var(--navy-100)}
/* ---------- final ---------- */
.result{display:grid;gap:18px}
.compass{width:min(86vw,400px);margin:0 auto;display:block}
.arch{text-align:center}
.arch .name{font-family:var(--font-light);font-weight:300;font-size:clamp(30px,7vw,40px);line-height:1.1}
.arch p{color:var(--ink-muted);font-size:17px;max-width:46ch;margin:8px auto 0}
.signals{display:grid;gap:8px;list-style:none}
.signals li{display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:10px;font-size:16px}
.signals li i{display:block;width:10px;height:10px;margin-top:6px;background:var(--blue-80)}
.signals li.hot i{background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-top:4px solid var(--navy-20);padding:10px 12px}
.kpi.hi{border-top-color:var(--accent)}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.kpi .v{font-family:var(--font-light);font-weight:300;font-size:30px;line-height:1.05;margin-top:4px}
.kpi .d{font-size:12px;color:var(--ink-muted)}
.sync{font-size:13px;color:var(--ink-muted);border-top:1px solid var(--line);padding-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync .dot{width:8px;height:8px;background:var(--navy-40);display:inline-block}
.sync .dot.ok{background:var(--positive)} .sync .dot.wait{background:var(--attention)} .sync .dot.err{background:var(--negative)}
/* ---------- transições ---------- */
.screen{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}.rx-opt{min-height:170px;font-size:18px;padding:18px 10px}.opt{padding:12px 12px}.wrap{padding:16px 14px 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* =====================================================================
   PAINEL DA FACILITAÇÃO (tema claro, pronto para projetar e imprimir)
   ===================================================================== */
body.painel{background:#fff;color:var(--navy-100)}
body.painel .top{background:#fff;border-bottom-color:var(--gray-100)}
body.painel .brand,body.painel .clock{color:var(--navy-80)} body.painel .brand b{color:var(--navy-100)}
.pn{width:100%;max-width:1200px;margin:0 auto;padding:24px 20px 60px;display:grid;gap:28px}
.pn h1{font-size:clamp(30px,5vw,44px);color:var(--navy-100)}
.pn h2{font-size:24px;color:var(--navy-100)}
.pn .eyebrow{color:var(--navy-80)} .pn .lede{color:var(--navy-80)} .pn .small{color:var(--navy-80)}
.pn .btn{background:var(--navy-100);color:#fff;border-color:var(--navy-100)} .pn .btn:hover{background:var(--navy-80)}
.pn .btn.sec{background:#fff;color:var(--navy-100);border-color:var(--navy-100)} .pn .btn.sec:hover{background:var(--gray-20)}
.pn .field input,.pn .field textarea{color:var(--navy-100);border-color:var(--gray-100)} .pn .field label{color:var(--navy-80)}
.src{display:grid;gap:12px;border:1px solid var(--gray-100);padding:16px}
.src .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pn-block{display:grid;gap:12px;border-top:1px solid var(--gray-100);padding-top:18px}
.pn-block.wide{break-inside:avoid}
.pn-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.hero-grid{display:grid;grid-template-columns:440px 1fr;gap:28px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero-txt{display:grid;gap:14px}
.hero-txt .big2{font-family:var(--font-light);font-weight:300;font-size:30px;line-height:1.15;color:var(--navy-100)}
.hero-txt .big2 b{font-weight:300;color:var(--navy-100);border-bottom:3px solid var(--accent)}
.arqs{display:grid;gap:6px}
.arqs>div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font-size:15px}
.arqs>div>b{font-family:var(--font-light);font-weight:300;font-size:26px;line-height:1;color:var(--navy-100);text-align:right}
.arqs>div span{color:var(--navy-80);font-size:13px;display:block}
@media (max-width:820px){.pn-grid{grid-template-columns:1fr}}
.pn .kpis{grid-template-columns:repeat(4,1fr)} @media (max-width:700px){.pn .kpis{grid-template-columns:1fr 1fr}}
.pn .kpi{border-color:var(--gray-100);border-top-color:var(--navy-100)} .pn .kpi.hi{border-top-color:var(--accent)} .pn .kpi .l,.pn .kpi .d{color:var(--navy-80)}
.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;font-size:15px}
.brow .tr{height:16px;background:var(--gray-40);position:relative}
.brow .tr i{position:absolute;left:0;top:0;height:100%;background:var(--navy-100)}
.brow .tr i.b2{background:var(--blue-100)}
.brow .tr em{position:absolute;top:-4px;width:3px;height:24px;background:var(--accent);margin-left:-1px}
.brow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.brow.sub{font-size:13px;color:var(--navy-80)}
.strip{position:relative;height:112px;border-bottom:1px solid var(--gray-100);margin:6px 0 4px}
.strip .ax{position:absolute;left:0;right:0;top:36px;height:2px;background:var(--gray-100)}
.strip .mid{position:absolute;left:50%;top:26px;height:22px;width:1px;background:var(--navy-40)}
.strip .p{position:absolute;top:24px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--navy-100);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.strip .p.plan{background:var(--accent);color:var(--navy-100);width:30px;height:30px;top:22px;margin-left:-15px;z-index:2}
.strip .p.team{background:#fff;color:var(--navy-100);border:2px solid var(--navy-100)}
.strip .lab{position:absolute;top:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-80)}
.strip .lab.r{right:0;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-100);background:var(--gray-20);border-top:2px solid var(--navy-100);padding:6px 8px}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--gray-100);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.plan td{background:var(--orange-20);font-weight:700}
.pautas{display:grid;gap:10px;list-style:none}
.pautas li{display:grid;grid-template-columns:28px 1fr;gap:12px;border:1px solid var(--gray-100);padding:12px 14px;font-size:16px;line-height:1.35}
.pautas li i{font-style:normal;width:28px;height:28px;background:var(--navy-100);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.pautas li b{display:block}
.pautas li span{color:var(--navy-80);font-size:14px}
.frases{display:grid;gap:8px}
.frases div{border-left:4px solid var(--blue-100);padding:6px 12px;font-size:16px;color:var(--navy-100)}
.frases div small{display:block;color:var(--navy-80);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--navy-80)}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:6px}
.foot{font-size:12px;color:var(--navy-80)}
@media print{body.painel .top,.src,.noprint{display:none!important}.pn{max-width:none;padding:0}.pn-block{break-inside:avoid;page-break-inside:avoid}}

function compute(a) {
  const rx = id => { const r = a.rx[id]; if (!r || r.side == null) return null; const def = REFLEX.find(x => x.id === id); return r.side === 'L' ? def.vL : def.vR; };

    const ok = parts.filter(p => p[0] != null); const tw = ok.reduce((s, p) => s + p[1], 0);
    return tw ? ok.reduce((s, p) => s + p[0] * p[1], 0) / tw : 50;
  };

  const mesa = a.mesa; const mesaTot = mesa.reduce((s, x) => s + x, 0);
  const nucleo = mesaTot ? (mesa[0] + mesa[1] + mesa[2]) / mesaTot * 100 : null;
  const focoMesa = nucleo == null ? null : clamp((nucleo - 40) / 55 * 100);
  const pilares = mesaTot ? clamp(100 - mesa.reduce((s, x, i) => s + Math.abs(x - PLAN_MESA[i]), 0) / 2) : null;
  const at = a.tel.atender.map(id => CALLS.find(c => c.id === id)).filter(Boolean);
  const postal = CALLS.find(c => c.id === a.tel.postal);
  const telPorta = at.filter(c => c.porta != null).map(c => c.porta); // chamadas de crise = 0, prevenção = 100
  const coreN = at.filter(c => c.core).length, negN = at.filter(c => c.neg).length;
  const telAnc = at.length ? clamp(coreN / 3 * 100 - negN * 20 + (postal && postal.neg ? 10 : 0)) : null;
  const prioAnc = a.prio.length === 5 ? (PRIO.filter(p => p.top).reduce((s, p) => s + (5 - a.prio.indexOf(p.id)), 0) - 6) / 3 * 100 : null; // 9 = melhor, 6 = pior
  const prioCon = a.prio.length === 5 ? (PRIO.filter(p => !p.top).reduce((s, p) => s + a.prio.indexOf(p.id), 0)) / 7 * 100 : null; // posições 0..4 → 7 = melhor
  const iaOpt = IA_OPTS.find(o => o.id === a.ia);
  const esp = ESPELHO.find(e => e.id === a.espelho);
  const engChosen = a.pessoas.includes('eng'), cioChosen = a.pessoas.includes('comercial');
  const planPerfis = a.pessoas.filter(id => (PERFIS.find(p => p.id === id) || {}).plan).length;
  const n = a.roupa.n;
  const d = {
    PORTA: clamp(mix([[esp ? esp.porta : null, .45], [rxAvg(['r1', 'r2']), .35], [telPorta.length ? avg(telPorta) : null, .2]]) + (cioChosen ? 8 : 0)),
    FOCO: clamp(mix([[rota ? rota.foco : null, .35], [rxAvg(['r3', 'r8']), .25], [focoMesa, .2], [clamp(100 - (n - 18) * 3.3), .2]])),
    RECEITA: clamp(mix([[rx('r4'), .4], [a.contrato.v, .6]])),
    PRODUTO: clamp(mix([[rx('r5'), .7], [postal && postal.id === 'cio_diag' ? 100 : at.some(c => c.id === 'cio_diag') ? 0 : 50, .3]])),
    IA: clamp(mix([[rx('r6'), .4], [iaOpt ? iaOpt.ia : null, .6]])),
    FABRICA: clamp(mix([[rx('r7'), .5], [engChosen ? 0 : 100, .25], [iaOpt && iaOpt.fabrica != null ? iaOpt.fabrica : 100, .25]])),
    ANCORAS: clamp(mix([[telAnc, .6], [prioAnc, .4]])),
    PILARES: pilares == null ? 50 : pilares,
    CONSOL: clamp(mix([[clamp(100 - Math.abs(n - 23) * 6), .5], [prioCon, .3], [clamp(100 - negN * 50), .2]])),
    PESSOAS: a.pessoas.length ? clamp(planPerfis * 50) : 50
  };
  const ader = Object.keys(DIMS).reduce((s, k) => s + DIMS[k].w * (100 - Math.abs(d[k] - DIMS[k].plan)), 0);
  // reflexo: velocidade, hesitação e coerência (instinto × reflexão)
  const times = REFLEX.map(r => a.rx[r.id]).filter(r => r && r.side != null).map(r => r.ms);
  const hes = REFLEX.filter(r => a.rx[r.id] && a.rx[r.id].hesitou).map(r => r.tema);
  const med = median(times);
  const speed = med == null ? .5 : clamp(1 - (med - 800) / 5200, 0, 1);
  const pares = [
    ['PORTA', rxAvg(['r1', 'r2']), esp ? esp.porta : null],
    ['IA', rx('r6'), iaOpt ? iaOpt.ia : null],
    ['FOCO', rxAvg(['r3', 'r8']), rota ? rota.foco : null]
  ].filter(p => p[1] != null && p[2] != null);
  const coer = pares.length ? 1 - avg(pares.map(p => Math.abs(p[1] - p[2]))) / 100 : .75;
  const divergente = pares.length ? pares.reduce((m, p) => Math.abs(p[1] - p[2]) > Math.abs(m[1] - m[2]) ? p : m) : null;
  const conv = .5 * speed + .5 * coer;

  const ang = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;

  return { d, aderencia: Math.round(ader), ang: Math.round(ang), x: Math.round(x), y: Math.round(y), quad, conv: Math.round(conv * 100), velocidade: med == null ? null : Math.round(med) / 1000,
    hesitacoes: hes.length, hesTemas: hes, coerencia: Math.round(coer * 100), divergente: divergente ? divergente[0] : null, topMesa, rota: a.rota, espelho: a.espelho, nucleo: nucleo == null ? null : Math.round(nucleo) };
}

const Sync = (() => {
  const Q = 'bussola-dts-envios'; const RETRY = 20000, MAXR = 300000;

  const notify = () => ls.forEach(f => { try { f(status()); } catch (e) { } });

    if (!url()) return;
    const key = linha.sessionId, body = JSON.stringify({ tipo: 'bussola', versao: VERSION, linha }), f = fp(body);

    const item = { key, body, fp: f, tries: 0, nextAt: 0 };

  async function post(u, body) {
    const init = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, cache: 'no-store' };

          <p class="small">Linha laranja: a opção mais próxima do plano. P = planejamento, T = média do time.</p>
          <h2 style="margin-top:8px">Foco × amplitude</h2>${dist('FOCO')}
          <table class="tbl"><thead><tr><th>Rota escolhida</th><th class="num">Votos</th></tr></thead><tbody>${rot.map(x => `<tr class="${x.r.id === 'B' ? 'plan' : ''}"><td>${x.r.nome} <span class="small">${x.r.txt}</span></td><td class="num">${x.n}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
      <div class="pn-block"><h2>Pautas sugeridas para a agenda presencial</h2><ul class="pautas">${pautas.map((p, i) => `<li><i>${i + 1}</i><div><b>${p.t}</b><span>${p.s}</span></div></li>`).join('')}</ul></div>
      <div class="pn-grid">
        <div class="pn-block"><h2>A mesa de investimento: time × plano</h2><div class="bars">${MESAS.map((m, i) => bar(m.nome, mean('mesaP' + (i + 1)), PLAN_MESA[i])).join('')}</div><p class="small">Barras: média de fichas do time. Marca laranja: fichas do planejamento (${PLAN_MESA.join(' · ')}). Núcleo (P1+P2+P3) do time: ${n ? Math.round(mean('nucleo')) : '—'}% contra 85% do plano.</p></div>
        <div class="pn-block"><h2>Os mostradores</h2><div class="bars">${dimKeys.filter(k => !['PORTA', 'FOCO', 'PILARES'].includes(k)).map(k => bar(DIMS[k].nome, mean(k), DIMS[k].plan)).join('')}</div><p class="small">0 = ${['RECEITA', 'PRODUTO', 'IA', 'FABRICA'].map(k => DIMS[k].esq.toLowerCase()).join(' / ')}; 100 = o lado do plano. Marca laranja: posição do planejamento.</p></div>
      </div>
      <div class="pn-grid">
        <div class="pn-block"><h2>O telefone: quem o time atende primeiro</h2><table class="tbl"><thead><tr><th>Chamada</th><th class="num">Atendida</th><th class="num">1ª</th><th class="num">Caixa postal</th></tr></thead><tbody>${tel.map(x => `<tr><td><b>${x.c.quem}</b> “${x.c.txt}” <span class="small">${x.c.core ? 'âncora do núcleo' : x.c.neg ? 'o plano deixa de vender à parte' : x.c.exp ? 'expansão' : x.c.cand ? 'oferta candidata' : 'prevenção com o CIO'}</span></td><td class="num">${x.at}</td><td class="num">${x.first}</td><td class="num">${x.postal}</td></tr>`).join('')}</tbody></table></div>
        <div class="pn-block"><h2>Reflexo, hesitação e convicção</h2>
          <div class="kpis"><div class="kpi hi"><div class="l">Reflexo médio</div><div class="v">${n ? fmt1(mean('velocidadeMed') || 0) + ' s' : '—'}</div><div class="d">por decisão de 6 s</div></div><div class="kpi"><div class="l">Hesitações</div><div class="v">${n ? rows.reduce((s, r) => s + (r.hesitacoes || 0), 0) : '—'}</div><div class="d">em ${n * 8} decisões</div></div><div class="kpi"><div class="l">Coerência</div><div class="v">${n ? Math.round(mean('coerencia')) + '%' : '—'}</div><div class="d">instinto × reflexão</div></div><div class="kpi"><div class="l">Aderência ao plano</div><div class="v">${n ? Math.round(mean('aderencia')) : '—'}</div><div class="d">média, de 100</div></div></div>
          <table class="tbl"><thead><tr><th>Nome</th><th>Arquétipo</th><th class="num">Aderência</th><th class="num">Reflexo</th><th class="num">Hesit.</th><th class="num">Coer.</th><th class="num">Tempo</th></tr></thead><tbody>${[...rows].sort((a, b) => (b.aderencia || 0) - (a.aderencia || 0)).map(r => `<tr><td>${esc(r.nome)}</td><td>${esc(r.arquetipo)}</td><td class="num">${r.aderencia ?? '—'}</td><td class="num">${r.velocidadeMed == null ? '—' : fmt1(r.velocidadeMed) + ' s'}</td><td class="num">${r.hesitacoes ?? '—'}</td><td class="num">${r.coerencia ?? '—'}%</td><td class="num">${r.duracaoSeg == null ? '—' : Math.floor(r.duracaoSeg / 60) + ':' + String(r.duracaoSeg % 60).padStart(2, '0')}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
      ${frases ? `<div class="pn-block"><h2>“Em 2027, o cliente liga para o DTS quando…”</h2><div class="frases">${frases}</div></div>` : ''}
      <p class="foot">Como ler: cada dimensão vai de 0 a 100; a posição do planejamento FY27 vem do material de planejamento (proposta DTS, a validar com os sócios). A aderência é a distância média ponderada entre as respostas e essa posição; serve para abrir a conversa, não para dar nota. Reflexo: mediana do tempo de resposta nas oito decisões de 6 segundos. Coerência: quanto o instinto (reflexos) e a reflexão (rota, espelho, pergunta de IA) apontam para o mesmo lado.</p>
    </div>`;
    el.querySelector('[data-p="live"]').onclick = async () => { const m = document.getElementById('srcmsg'); m.textContent = 'Lendo a planilha…'; try { setRows(await fetchLive(), 'planilha (ao vivo, atualiza a cada 30 s)'); clearInterval(liveTimer); liveTimer = setInterval(async () => { try { const rs = await fetchLive(); if (rs.length !== rows.length) setRows(rs, 'planilha (ao vivo, atualiza a cada 30 s)'); } catch (e) { } }, 30000); } catch (e) { m.textContent = 'Não deu para ler a planilha: ' + e.message; } };
    el.querySelector('[data-p="local"]').onclick = () => { const rs = []; try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.finishedAt) { const keep = S; S = d; rs.push(buildRow()); S = keep; } } catch (e) { } setRows(rs, 'este navegador'); if (!rs.length) document.getElementById('srcmsg').textContent = 'Nenhuma resposta concluída neste navegador.'; };
    el.querySelector('[data-p="demo"]').onclick = () => setRows(demo(), 'dados de exemplo (fictícios)');
    el.querySelector('[data-p="print"]').onclick = () => window.print();
    el.querySelector('[data-p="copy"]').onclick = () => { const txt = resumoTexto(rows, gaps, pautas, mean); navigator.clipboard.writeText(txt).then(() => document.getElementById('srcmsg').textContent = 'Resumo copiado.'); };
    el.querySelector('[data-p="paste"]').onclick = () => { const t = document.getElementById('paste').value.trim(); if (!t) return; try { let rs; if (t[0] === '[' || t[0] === '{') { const j = JSON.parse(t); rs = Array.isArray(j) ? j : j.linhas || []; } else rs = parseCsv(t); setRows(rs, 'colado'); document.getElementById('srcmsg').textContent = rs.length + ' linha(s) lidas.'; } catch (e) { document.getElementById('srcmsg').textContent = 'Não entendi o conteúdo colado: ' + e.message; } };
  }
  function heroTexto(rows, mean, teamAng, ph) {
    const n = rows.length; if (!n) return '<p class="lede">Quando as respostas chegarem, aqui aparece a leitura do time: para onde aponta, o quanto está junto e a distância para o planejamento.</p>';
    const diff = Math.abs(((teamAng - ph.ang) + 540) % 360 - 180);
    const px = mean('PORTA'), py = mean('FOCO');
    const lado = px < 42 ? 'para o CFO, na crise' : px > 58 ? 'para o CIO, na prevenção' : 'para o caminho do meio';
    const foco = py > 60 ? 'com foco no núcleo' : py < 40 ? 'abrindo frentes' : 'entre foco e amplitude';
    const cnt = {}; rows.forEach(r => cnt[r.arquetipo] = (cnt[r.arquetipo] || 0) + 1);
    const arqs = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
    const sdP = Math.sqrt(avg(rows.map(r => (r.PORTA - px) ** 2))), juntos = sdP < 15 ? 'bem alinhado' : sdP < 25 ? 'parcialmente alinhado' : 'dividido';
    return `<div class="big2">O time aponta <b>${lado}</b>, ${foco}.</div>
      <p class="lede" style="font-size:17px">${diff < 25 ? 'Direção parecida com a do planejamento' : diff < 60 ? 'Direção próxima, com desvio em relação ao planejamento' : 'Direção diferente da do planejamento'} (${Math.round(diff)}° de diferença). No dilema CFO × CIO o time está <b>${juntos}</b>.</p>
      <div class="arqs">${arqs.map(([a, c]) => `<div><b>${c}</b><div>${esc(a)}<span>${esc((Object.values(ARQUETIPOS).find(x => x.nome === a) || {}).txt || '')}</span></div></div>`).join('')}</div>`;
  }
  function resumoTexto(rows, gaps, pautas, mean) {
    const n = rows.length; const L = [`Bússola DTS 2027 · resumo (${n} respostas)`, ''];
    Object.keys(DIMS).forEach(k => L.push(`${DIMS[k].nome}: time ${n ? Math.round(mean(k)) : '—'} · plano ${DIMS[k].plan}`));
    L.push('', 'Mesa de investimento (time × plano): ' + MESAS.map((m, i) => `${m.nome} ${n ? Math.round(mean('mesaP' + (i + 1))) : '—'}/${PLAN_MESA[i]}`).join(' · '));
    L.push('', 'Pautas sugeridas:'); pautas.forEach((p, i) => L.push(`${i + 1}. ${p.t} ${p.s}`));
    L.push('', 'Por pessoa:'); rows.forEach(r => L.push(`- ${r.nome}: ${r.arquetipo} · aderência ${r.aderencia} · reflexo ${r.velocidadeMed == null ? '—' : fmt1(r.velocidadeMed) + 's'} · hesitações ${r.hesitacoes} · coerência ${r.coerencia}%`));
    return L.join('\n');
  }
  draw();
}

if (new URLSearchParams(location.search).has('painel')) painel();
else { render(); clockTimer = setInterval(clock, 1000); }
