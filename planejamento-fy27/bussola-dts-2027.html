          <div class="pcard"><h2>Os mostradores</h2><div class="bars">${dimKeys.filter(k => !['PORTA', 'FOCO', 'PILARES'].includes(k)).map(k => bar(DIMS[k].nome, mean(k), DIMS[k].plan)).join('')}</div><p class="small">0 = ${['RECEITA', 'PRODUTO', 'IA', 'FABRICA'].map(k => DIMS[k].esq.toLowerCase()).join(' / ')}; 100 = o lado do plano. Marca laranja: posição do planejamento.</p></div>
        </div>`],
      ['Carga', `<h2>O que DTS vende e o que segura a venda</h2>
        <div class="pcols3 cargacols">
          ${[[0, 1], [2, 3]].map(ix => `<div class="pcard">${ix.map(gi => { const g = CATALOGO[gi], st = prodStats.filter(s => s.x.g === g.id); return `<div class="mgp"><div class="mgph"><b title="${esc(g.pilar)}">${esc(g.curto)}</b><span>${nc ? Math.round(avg(st.map(s => s.f)) * 100) + '% a bordo' : ''}</span></div>${st.map(s => `<div class="mrow ${nc && s.f >= .75 ? 'hi' : nc && s.f <= .25 ? 'lo' : ''}"><span>${esc(s.x.nome)}</span><div class="tr"><i style="width:${s.f * 100}%"></i></div><b>${nc ? s.v : '—'}</b></div>`).join('')}</div>`; }).join('')}</div>`).join('')}
          <div class="pcard">
            <div class="kpis light"><div class="kpi hi"><div class="l">A bordo</div><div class="v">${n && mean('produtos2027') != null ? Math.round(mean('produtos2027')) : '—'}</div><div class="d">produtos · hoje, 33</div></div><div class="kpi"><div class="l">Vento</div><div class="v">${ventoM == null ? '—' : fmt1(ventoM)}</div><div class="d">${ventoM == null ? 'de 1 a 5' : ventoNome(ventoM).toLowerCase() + ' · 1 a 5'}</div></div></div>
            <h2 style="font-size:1.02em;margin-top:.8em">Cargas novas</h2>
            ${novas.length ? `<div class="nlist">${novas.slice(0, 3).map(x => `<div><span>${esc(x.nome)}</span><b>${x.n}</b></div>`).join('')}</div>` : '<p class="small">Nenhuma carga nova sugerida.</p>'}
            <h2 style="font-size:1.02em;margin-top:.8em">O que mais segura a venda</h2>
            <div class="hbars">${anc.map(h => `<div class="mrow hrow"><span title="${esc(h.x.mar)}: ${esc(h.x.txt)}">${h.x.nome}</span><div class="tr"><i style="width:${n ? h.n / n * 100 : 0}%"></i></div><b>${h.n}</b></div>`).join('')}</div>
            <p class="small" style="margin-top:.6em">Barras: diretores que embarcam o produto${nc ? ` (de ${nc})` : ''}. Negrito: 3 de 4 ou mais. Riscado: 1 de 4 ou menos.</p>
          </div>
        </div>`],
      ['Reflexos', `<div class="pcols">
          <div class="pcard"><h2>O rádio de bordo: quem o time atende primeiro</h2><table class="tbl"><thead><tr><th>Chamado</th><th class="num">Atendido</th><th class="num">1º</th><th class="num">Sem resposta</th></tr></thead><tbody>${tel.map(x => `<tr><td><b>${x.c.quem}</b> “${x.c.txt}” <span class="small">${x.c.core ? 'âncora do núcleo' : x.c.neg ? 'o plano deixa de vender à parte' : x.c.exp ? 'expansão' : x.c.cand ? 'oferta candidata' : 'prevenção com o CIO'}</span></td><td class="num">${x.at}</td><td class="num">${x.first}</td><td class="num">${x.postal}</td></tr>`).join('')}</tbody></table></div>
          <div class="pcard"><h2>Reflexo e hesitação</h2>
            <div class="kpis light"><div class="kpi hi"><div class="l">Reflexo médio</div><div class="v">${n ? fmt1(mean('velocidadeMed') || 0) + ' s' : '—'}</div><div class="d">por decisão de ${REFLEX_MS / 1000} s</div></div><div class="kpi"><div class="l">Hesitações</div><div class="v">${n ? rows.reduce((s, r) => s + (r.hesitacoes || 0), 0) : '—'}</div><div class="d">em ${n * 8} decisões</div></div><div class="kpi"><div class="l">Coerência</div><div class="v">${n ? Math.round(mean('coerencia')) + '%' : '—'}</div><div class="d">instinto × reflexão</div></div><div class="kpi"><div class="l">Aderência</div><div class="v">${n ? Math.round(mean('aderencia')) : '—'}</div><div class="d">média, de 100</div></div></div>
            <table class="tbl" style="margin-top:.8em"><thead><tr><th>Nome</th><th>Arquétipo</th><th class="num">Ader.</th><th class="num">Reflexo</th><th class="num">Hesit.</th><th class="num">Rev.</th><th class="num">Coer.</th><th class="num">Tempo</th></tr></thead><tbody>${[...rows].sort((a, b) => (b.aderencia || 0) - (a.aderencia || 0)).map(r => `<tr><td>${esc(r.nome)}</td><td>${esc(r.arquetipo)}</td><td class="num">${r.aderencia ?? '—'}</td><td class="num">${r.velocidadeMed == null ? '—' : fmt1(r.velocidadeMed) + ' s'}</td><td class="num">${r.hesitacoes ?? '—'}</td><td class="num">${r.revisoes || 0}</td><td class="num">${r.coerencia ?? '—'}%</td><td class="num">${r.duracaoSeg == null ? '—' : Math.floor(r.duracaoSeg / 60) + ':' + String(r.duracaoSeg % 60).padStart(2, '0')}</td></tr>`).join('')}</tbody></table>
          </div>
        </div>`],
      ['Garrafas', `<h2>“Em 2027, o cliente liga para DTS quando…”</h2>${frases ? `<div class="frases">${frases}</div>` : '<p class="lede">Nenhuma mensagem na garrafa ainda.</p>'}
        <p class="foot">Como ler: cada dimensão vai de 0 a 100; a posição do planejamento FY27 vem do material de planejamento (proposta DTS, a validar com os sócios). A aderência é a distância média ponderada entre as respostas e essa posição; serve para abrir a conversa, não para dar nota. Reflexo: mediana do tempo de resposta nas oito decisões de até 30 segundos. Coerência: quanto o instinto (reflexos) e a reflexão (rota, farol, pergunta de IA) apontam para o mesmo lado.</p>`]
    ];
    PAGES = pages.map(p => p[0]); pIdx = Math.min(pIdx, PAGES.length - 1);
    el.innerHTML = pages.map(([t, h], i) => `<section class="ps ${i === pIdx ? 'on' : ''}" data-t="${t}">${h}</section>`).join('');
    painelNav();
    el.querySelector('[data-p="ptest"]').onclick = async () => { const m = document.getElementById('srcmsg'); m.textContent = 'Testando…'; const r = await Sync.ping(); m.textContent = r.ok ? `✔ A planilha respondeu (${r.respostas} resposta${r.respostas === 1 ? '' : 's'} guardada${r.respostas === 1 ? '' : 's'}). As respostas dos diretores vão chegar.` : '✘ ' + r.msg; };
    el.querySelector('[data-p="files"]').onclick = () => document.getElementById('pfiles').click();
    document.getElementById('pfiles').onchange = async e => { const m = document.getElementById('srcmsg'); let all = [], ruins = 0; for (const f of e.target.files) { try { all = all.concat(parseAny(await f.text())); } catch (er) { ruins++; } } if (all.length) setRows(juntar(all), 'arquivos de resposta'); document.getElementById('srcmsg').textContent = `${all.length} resposta(s) lida(s)${ruins ? `, ${ruins} arquivo(s) não entendido(s)` : ''}.`; };
    el.querySelector('[data-p="live"]').onclick = async () => { const m = document.getElementById('srcmsg'); const tk = document.getElementById('ptoken'); if (tk && tk.value.trim()) guardaSenha(tk.value.trim()); m.textContent = 'Lendo a planilha…'; try { const rs0 = await fetchLive(); sig = assin(rs0); setRows(rs0, 'planilha (ao vivo, atualiza a cada 10 s)'); clearInterval(liveTimer); liveTimer = setInterval(async () => { try { const rs = await fetchLive(), s2 = assin(rs); if (s2 !== sig) { sig = s2; setRows(rs, 'planilha (ao vivo, atualiza a cada 10 s)'); } } catch (e) { } }, 10000); } catch (e) { m.textContent = 'Não deu para ler a planilha: ' + e.message; } };
    el.querySelector('[data-p="local"]').onclick = () => { const rs = []; try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.finishedAt) { const keep = S; S = d; rs.push(buildRow()); S = keep; } } catch (e) { } setRows(rs, 'este navegador'); if (!rs.length) document.getElementById('srcmsg').textContent = 'Nenhuma resposta concluída neste navegador.'; };
    el.querySelector('[data-p="demo"]').onclick = () => setRows(demo(), 'dados de exemplo (fictícios)');
    el.querySelector('[data-p="print"]').onclick = () => window.print();
    el.querySelector('[data-p="copy"]').onclick = () => { const txt = resumoTexto(rows, gaps, pautas, mean, manif); navigator.clipboard.writeText(txt).then(() => document.getElementById('srcmsg').textContent = 'Resumo copiado.'); };
    const nb = el.querySelector('[data-p="names"]'); if (nb) nb.onclick = () => { showNames = !showNames; draw(); };
    el.querySelector('[data-p="paste"]').onclick = () => { const t = document.getElementById('paste').value.trim(); if (!t) return; try { const rs = parseAny(t); setRows(juntar(rs), 'colado'); document.getElementById('srcmsg').textContent = rs.length + ' linha(s) lidas.'; } catch (e) { document.getElementById('srcmsg').textContent = 'Não entendi o conteúdo colado: ' + e.message; } };
  }
  function heroTexto(rows, mean, teamAng, ph) {
    const n = rows.length; if (!n) return '<p class="lede">Quando as respostas chegarem, aqui aparece a leitura do time: para onde aponta, o quanto está junto e a distância para o planejamento.</p>';
    const diff = Math.abs(((teamAng - ph.ang) + 540) % 360 - 180);
    const px = mean('PORTA'), py = mean('FOCO');
    const lado = px < 42 ? 'para o CFO, na crise' : px > 58 ? 'para o CIO, na prevenção' : 'para o caminho do meio';
    const foco = py > 60 ? 'com foco no núcleo' : py < 40 ? 'abrindo frentes' : 'entre foco e amplitude';
    const cnt = {}; rows.forEach(r => cnt[r.arquetipo] = (cnt[r.arquetipo] || 0) + 1);
    const arqs = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
    const sdP = Math.sqrt(avg(rows.map(r => (r.PORTA - px) ** 2))), juntos = sdP < 15 ? 'bem alinhado' : sdP < 25 ? 'parcialmente alinhado' : 'dividido';
    return `<div class="big2">O time aponta <b>${lado}</b>, ${foco}.</div>
      <p class="lede" style="font-size:17px">${diff < 25 ? 'Direção parecida com a do planejamento' : diff < 60 ? 'Direção próxima, com desvio em relação ao planejamento' : 'Direção diferente da do planejamento'} (${Math.round(diff)}° de diferença). No dilema CFO × CIO o time está <b>${juntos}</b>.</p>
      <div class="arqs">${arqs.map(([a, c]) => `<div><b>${c}</b><div>${esc(a)}<span>${esc((Object.values(ARQUETIPOS).find(x => x.nome === a) || {}).txt || '')}</span></div></div>`).join('')}</div>`;
  }
  function resumoTexto(rows, gaps, pautas, mean, manif) {
    const n = rows.length; const L = [`Bússola DTS 2027 · resumo (${n} respostas)`, ''];
    Object.keys(DIMS).forEach(k => L.push(`${DIMS[k].nome}: time ${n ? Math.round(mean(k)) : '—'} · plano ${DIMS[k].plan}`));
    L.push('', 'Mesa de investimento (time × plano): ' + MESAS.map((m, i) => `${m.nome} ${n ? Math.round(mean('mesaP' + (i + 1))) : '—'}/${PLAN_MESA[i]}`).join(' · '));
    if (manif) L.push('', manif);
    L.push('', 'Pautas sugeridas:'); pautas.forEach((p, i) => L.push(`${i + 1}. ${p.t} ${p.s}`));
    L.push('', 'Por pessoa:'); rows.forEach(r => L.push(`- ${r.nome}: ${r.arquetipo} · aderência ${r.aderencia} · reflexo ${r.velocidadeMed == null ? '—' : fmt1(r.velocidadeMed) + 's'} · hesitações ${r.hesitacoes} · coerência ${r.coerencia}%`));
    return L.join('\n');
  }
  draw();
}

/* ===================================================================== */
/* 9 · INÍCIO                                                            */
/* ===================================================================== */
buildScene(); buildVoyage();
if (new URLSearchParams(location.search).has('painel')) painel();
else {
  render(); setInterval(clock, 1000);
  if (stepId() === 'capa' && !REDUCED) { const b = $('#blackout'); b.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => b.classList.remove('on'))); }
}
</script>
